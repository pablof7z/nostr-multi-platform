[package]
name = "nmp-defaults"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The framework's default composition for an NMP-based Nostr application (ADR-0046 — composition is a library, not a generator). One call (`register_defaults`) wires the default action modules (NIP-01 publish, NIP-02 follow/react, NIP-17 send + DM-relay-list publish, NIP-57 zap, NIP-65 publish_relay_list), the default ingest parsers (kind:10050 → `DmRelayCache`), the production routing substrate (`GenericOutboxRouter` + `InMemoryMailboxCache`), indexer-republish policy, the canonical DM-inbox + zap-receipts runtimes, and the D2 coverage hook. The Bevy-`DefaultPlugins` / Spring-Boot-starter pattern. Closes V-48 (step 10 of `docs/architecture/crate-boundaries.md` §5)."

[dependencies]
# Kernel substrate — `ActorCommand`, observer traits, the routing
# substrate factory seam, and the app-neutral `AppHost` registration trait.
nmp-core = { path = "../nmp-core" }
# Canonical Nostr kind-integer registry used by default action modules.
nmp-kinds = { path = "../nmp-kinds" }
# Direct dep on nmp-planner for InterestShape / InterestId / InterestLifecycle /
# InterestScope / LogicalInterest — the nmp_core::planner compat facade is
# deleted (#1608).
nmp-planner = { path = "../nmp-planner" }
# Direct dep on nmp-store for EventStore / VerifiedEvent / RawEvent —
# the nmp_core::store compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store" }
# Layer-2 routing: `GenericOutboxRouter`, `InMemoryMailboxCache`, and the
# `nmp.nip65.publish_relay_list` action module the template registers.
nmp-router = { path = "../nmp-router" }
# Wasm-safe default cache/parser wiring shared by this native AppHost
# composition root and reducer-owned web roots.
nmp-substrate-defaults = { path = "../nmp-substrate-defaults" }
# Common NIP action modules + ingest parsers the canonical NMP composition
# wires by default. A second app that does not need one of these is expected
# to call the per-NIP `register_actions` selectively rather than
# `register_defaults` wholesale.
nmp-nip02 = { path = "../nmp-nip02" }
nmp-nip25 = { path = "../nmp-nip25" }
# NIP-84 kind:9802 highlights: `Nip84Descriptor::register_actions` installs the
# `nmp.nip84.publish_highlight` action module (yielding default).
nmp-nip84 = { path = "../nmp-nip84" }
# NIP-22 comments: `register_comment_runtime` installs the kind:1111
# `CommentThreadProjection` observer + the `nmp.nip22.post_comment` action.
nmp-nip22 = { path = "../nmp-nip22" }
nmp-nip11 = { path = "../nmp-nip11" }
nmp-nip17 = { path = "../nmp-nip17" }
# NIP-47 Nostr Wallet Connect: `register_wallet` is wired through the
# `NmpAppBuilder::with_wallet` typed builder step so the wallet runtime is
# installed during the config phase, before `start()` consumes the builder
# (V-95 / issue #619 — install-before-dispatch enforced by move semantics).
nmp-nip47 = { path = "../nmp-nip47" }
nmp-nip57 = { path = "../nmp-nip57" }
# NIP-50 public full-text search scopes (#1811): `register_search_scopes`
# installs the `nip50.profiles` / `nip50.notes` / `nip50.longform`
# crate-owned `SearchScopeProvider`s into the shared FTS scope registry so the
# cache-serve path can serve search from the tokenized store index. Public,
# additive/yielding, names no FTS noun in core (D0). Also provides
# `register_input_scopes` (#1804, S7) for the three NIP-50 input-intent
# recognizers wired in the always-on block.
nmp-nip50 = { path = "../nmp-nip50" }
# NIP-29 relay-based groups: provides `register_input_scopes` (#1804, S7)
# that installs the `nip29.groups` input-scope recognizer (NIP-29 URI form
# + naddr references → GroupIdentPayload) in the social-feature block.
# The recognizer is pure/IO-free and belongs alongside the other social-tier
# registrations.
nmp-nip29 = { path = "../nmp-nip29" }
nmp-nip77 = { path = "../nmp-nip77" }
nmp-wot = { path = "../nmp-wot" }
# NIP-51 mute-list adapter: `MuteListProjection` (kind:10000 observer +
# `SuppressionLookup` impl). Registered in `register_mute_runtime` so the
# active account's muted pubkeys and event-ids are suppressed from every
# timeline projection that calls `set_suppression` with the returned Arc.
nmp-nip51 = { path = "../nmp-nip51" }
# Layer-A content sidecar: supplies the typed NIP-23 `LongformProjection`
# (reuses the existing `ArticleProjection` resolver) the template registers as
# the default kind:30023 TYPED snapshot projection (`nmp.nip23.articles`).
nmp-content = { path = "../nmp-content" }
# D2 coverage-gate policy: thresholds + back-off rules for the default
# `set_coverage_hook` installation. Zero `nmp-core` dep (the gate is pure
# policy data); this assembly crate is one of the layers entitled to depend
# on both `nmp-core` and the coverage-gate crate.
nmp-coverage-gate = { path = "../nmp-coverage-gate" }
# V-80 rung 6 (`register_op_feed_defaults`): the OP-centric home-feed
# composition. The composition root is the ONE crate entitled to name
# `NmpApp` (`nmp-ffi`) in production — every other crate goes through the
# `AppHost` trait or `nmp-core` primitives to avoid the dependency-graph
# inversion rungs 4/5 rejected. `nmp-nip01` supplies the NIP-10 OP-feed
# instance (`register_op_feed`); `nmp-feed` supplies the `FeedController` /
# `EventLookup` types the engine is cast to.
nmp-ffi = { path = "../nmp-ffi" }
nmp-nip01 = { path = "../nmp-nip01" }
nmp-nip18 = { path = "../nmp-nip18" }
nmp-feed = { path = "../nmp-feed" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
nostr = { version = "0.44", default-features = false, features = ["std"] }

[features]
# `wasm-safe`: disable native I/O-bound features so the crate can be used
# in wasm32 targets. Forwards to nmp-core's default-features=false mode,
# which gates out the actor runtime, relay_worker, and LMDB backend.
# The kernel + substrate traits remain available for browser composition roots
# like nmp-browser-runtime to wire custom I/O adapters. (ADR-0065)
wasm-safe = []

[dev-dependencies]
# Test-support gates expose the FFI `nmp_app_new` / `nmp_app_free` symbols
# through a normal Rust path so the integration test can spin up a real
# `NmpApp`, call `register_defaults`, and inspect the resulting registry
# entries. Mirrors the per-NIP-crate test pattern (`nmp-nip17`,
# `nmp-app-chirp`).
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-codegen = { path = "../nmp-codegen" }
# Same posture for the extracted FFI crate so dev/test builds see
# `nmp_app_new`/`nmp_app_free`.
nmp-ffi = { path = "../nmp-ffi", features = ["test-support"] }
# nmp-nip59: used by runtimes_dm_inbox_tests to build gift-wrap envelopes for
# the account-switch clear test (issue #1138). nmp-nip17 already depends on
# nmp-nip59 transitively; this adds a direct dev-dep for the test helpers.
nmp-nip59 = { path = "../nmp-nip59" }
# `ModulePolicy` used by `ModularTimelineSpec` in the mute-runtime integration
# tests — supplies thread-model configuration for timeline projections.
nmp-threading = { path = "../nmp-threading" }
# `nmp-nip51` is a runtime dep but must also appear in dev-deps so the test
# binary can name `nmp_nip51::MuteListProjection` directly (test-support path).
nmp-nip51 = { path = "../nmp-nip51" }
