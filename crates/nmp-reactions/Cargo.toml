[package]
name = "nmp-reactions"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Protocol-owned reaction (kind:7) count read for NMP apps: open_reactions over the NIP-25 adapter."

[lib]
crate-type = ["rlib"]

[dependencies]
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false }
nmp-nip25 = { path = "../nmp-nip25" }
nmp-ownership = { workspace = true }
nmp-planner = { path = "../nmp-planner" }
nmp-read-session = { path = "../nmp-read-session" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
