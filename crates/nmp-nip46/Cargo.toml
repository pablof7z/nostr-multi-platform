[package]
name = "nmp-nip46"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic NIP-46 protocol core (pure event-reducer handshake + RPC helpers)."

[lib]
name = "nmp_nip46"
crate-type = ["rlib"]

[dependencies]
nostr = { version = "0.44", features = ["std", "nip04", "nip44"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
