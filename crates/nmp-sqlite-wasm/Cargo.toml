[package]
name = "nmp-sqlite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OPFS-backed SQLite EventStore backend for wasm32 (#1007). Spine only — the SQLite engine + EventStore impl land in later PRs."

[lib]
name = "nmp_sqlite_wasm"
path = "src/lib.rs"

# Target-agnostic deps. `serde`/`serde_json` back the wire ⇆ row codec (`conv`):
# the `events.raw` blob is canonical NIP-01 JSON (mirroring the LMDB backend's
# JSON round-trip), and `TombstoneOrigin` derives serde for parity with
# `nmp_store::TombstoneOrigin`. Both are pure Rust and build on wasm32 and
# native alike — they are NOT the "external SQLite engine" ADR-0072 §1 forbids
# (that engine remains the vendored artifact), so they belong here, not under
# the wasm-only target table below.
[dependencies]
nmp-ownership = { workspace = true }
nmp-kinds = { path = "../nmp-kinds" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# NOTE: this crate must NOT depend on `nmp-store`. `nmp-store` declares an
# optional dependency on `nmp-sqlite-wasm` (the `opfs-sqlite-backend` feature),
# so a reverse edge would be a Cargo dependency cycle. This mirrors
# `nmp-nostr-lmdb`, which is a standalone engine crate: the `EventStore` trait
# impl that bridges this engine (`OpfsSqliteEventStore`, parallel to
# `LmdbEventStore`) lives in `nmp-store` behind the feature, not here. This
# crate owns only the SQLite-on-OPFS engine + the `OpfsSqliteStore` handle and
# its single scoped `unsafe impl Send/Sync` (ADR-0072 §3).

# wasm-only JS/OPFS interop. SQLite-on-OPFS is a browser-only backend: the
# engine reaches the filesystem through `web-sys`/`js-sys` and is driven from
# a Worker via `wasm-bindgen`. These deps do NOT build on native, so they are
# gated to wasm32 — the whole crate compiles to ~nothing off-wasm. See the
# `[target.…]` table difference vs. nmp-nostr-lmdb (heed builds everywhere).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"
# Bridges the async halves of the shim (`sqlite3InitModule` / opfs-sahpool pool
# open both return JS Promises) into Rust `Future`s via `JsFuture`. Part of the
# wasm-bindgen toolchain (MIT/Apache-2.0), not an external engine dependency —
# ADR-0072 §1's "zero external Rust crates" refers to the SQLite engine, which
# remains a vendored artifact, not a crate.
wasm-bindgen-futures = "0.4.72"
