[package]
name = "nmp-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Layer-1 network transport: native WebSocket relay worker (tungstenite/mio/rustls) + wasm32 browser relay driver (web_sys::WebSocket), wire-transport-agnostic relay protocol primitives (backoff, keepalive, jitter, HTTP-denial classifier). See docs/architecture/crate-boundaries.md §8 — extraction, push-model Pool, BrowserRelayDriver, and NIP-46 actor-Pool lane (nmp-nip46-runtime) all shipped."

[lib]
name = "nmp_network"
crate-type = ["rlib"]

[features]
# Native I/O layer — gates the relay_worker (tungstenite/mio/rustls).
# The `relay_protocol` module compiles unconditionally so wasm32 callers
# (the `browser_driver` here in this crate, and any future direct callers
# from `nmp-browser-runtime`) can share the same constants.
default = ["native"]
native = ["dep:tungstenite", "dep:mio", "dep:rustls"]

[dependencies]
nmp-ownership = { workspace = true }
# Step 8 phase A: `nmp-network` is the lowest layer of the migration ladder —
# it MUST NOT depend on `nmp-core` (the cycle direction would be
# `nmp-core → nmp-network → nmp-core`). The transport-layer value types
# the worker uses live here directly: `RelayRole` (the lane discriminator),
# `KeepaliveState` / `KeepaliveAction` (the keepalive FSM). The
# kernel's `RelayFrame` stays in `nmp-core`; the `tungstenite::Message →
# RelayFrame` adapter lives there too (it bridges this crate's wire type
# to the kernel's frame enum at the actor seam). Phase C
# (`BrowserRelayDriver` move) preserves the same direction: the browser
# driver takes its kernel touchpoints through an `Rc<dyn Fn>` callback
# bag (`BrowserKernelHandlers`) constructed in `nmp-browser-runtime`, so the driver
# itself never names a kernel type.
#
# Native-only I/O deps — gated behind `native`, mirroring the old
# nmp-core posture exactly so the move is value-preserving.
mio = { version = "1", features = ["os-ext", "os-poll"], optional = true }
rustls = { workspace = true, default-features = false, features = ["ring"], optional = true }
tungstenite = { workspace = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }

# Step 8 phase E: pre-classify the inbound `["AUTH", <challenge>]` wire
# frame into [`pool::RelayFrame::Auth`] so the kernel sees a typed
# variant instead of re-discovering AUTH from raw text. `nmp-nip42-types`
# is the dependency-free wire/type substrate (serde/serde_json only —
# no workspace deps), purpose-built so both `nmp-core` (the FSM owner)
# and `nmp-network` (the wire layer) share the exact parse without a
# crate cycle. This crate only uses `parse_auth_frame` — it does NOT
# import the FSM (`AuthGate`) or the kind:22242 builder; those live in
# `nmp-core::subs::AuthGate` and `nmp-nip42::builder` respectively.
nmp-nip42-types = { path = "../nmp-nip42-types" }
# Layer-0 relay-URL canonicalization authority (#967). The pool keys slots on
# the canonical relay URL; sharing the one normalization keeps the pool's slot
# key identical to the kernel/router key. `nmp-relay-url` is dependency-free, so
# this does not violate the "no nmp-core" rule above (Layer 1 may depend on L0).
nmp-relay-url = { path = "../nmp-relay-url" }
serde_json = "1"

# Step 8 phase C — `BrowserRelayDriver` owns the `web_sys::WebSocket`
# lifecycle. Feature set kept minimal (mirrors what the retired `nmp-wasm` carried
# before the move): `WebSocket` itself for send/close, `MessageEvent` to
# read incoming frames, `CloseEvent` for the close reason, `ErrorEvent`
# to surface socket errors, `BinaryType` to opt into ArrayBuffer payloads.
#
# Reconnect timers use `gloo_timers::callback::Timeout` (#2071) which
# schedules via `js_sys::global()` — works in both Window and
# WorkerGlobalScope — rather than `web_sys::window()` which returns `None`
# inside a Worker. `Window` is therefore NOT in the web-sys feature list.
#
# All crates are wasm32-only — gated through the `target.*.dependencies`
# table so native builds do not see them. The corresponding module
# (`browser_driver`) is `#[cfg(target_arch = "wasm32")]`-gated in lib.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = "0.3"
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"
web-sys = { version = "0.3.98", features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "MessageEvent",
    "WebSocket",
] }
