[package]
name = "nmp-native-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust runtime owner for NMP applications: NmpApp, actor lifecycle, runtime slots, native builder, and AppHost integration."

[lib]
name = "nmp_native_runtime"
crate-type = ["rlib"]

[features]
default = ["native"]
native = [
    "nmp-core/native",
    "nmp-router/native",
]
nip05 = [
    "native",
    "dep:nmp-nip05",
    "nmp-nip05/native",
]
wallet = [
    "native",
    "dep:nmp-nip47",
    "dep:nmp-nip57",
    "nmp-nip57/native",
]
search = [
    "native",
    "dep:nmp-nip50",
]
op-feed = [
    "native",
    "dep:nmp-nip02",
    "dep:nmp-nip51",
    "dep:nmp-note-feed",
]
signer-broker = [
    "native",
    "dep:nmp-nip46-runtime",
    "dep:nmp-nip46",
    "dep:nmp-signer-iface",
    "dep:nmp-signers",
]
external-signer = [
    "native",
    "dep:nmp-signer-iface",
    "dep:nmp-signers",
]
android-ffi = ["native", "external-signer"]
test-support = ["native", "nmp-core/test-support"]
marmot = ["native", "dep:nmp-marmot"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-router = { path = "../nmp-router", default-features = false, version = "1.0.0-rc.1" }
nmp-planner = { path = "../nmp-planner", default-features = false, version = "1.0.0-rc.1" }
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
nmp-content = { path = "../nmp-content", version = "1.0.0-rc.1" }
nmp-feed = { path = "../nmp-feed", version = "1.0.0-rc.1" }
nmp-feed-session = { path = "../nmp-feed-session", version = "1.0.0-rc.1" }
nmp-read-session = { path = "../nmp-read-session", version = "1.0.0-rc.1" }
nmp-note-feed = { path = "../nmp-note-feed", optional = true, version = "1.0.0-rc.1" }
nmp-nip02 = { path = "../nmp-nip02", optional = true, version = "1.0.0-rc.1" }
nmp-nip05 = { path = "../nmp-nip05", optional = true, version = "1.0.0-rc.1" }
nmp-nip46 = { path = "../nmp-nip46", optional = true, version = "1.0.0-rc.1" }
nmp-nip46-runtime = { path = "../nmp-nip46-runtime", optional = true, version = "1.0.0-rc.1" }
nmp-nip47 = { path = "../nmp-nip47", optional = true, version = "1.0.0-rc.1" }
nmp-nip50 = { path = "../nmp-nip50", optional = true, version = "1.0.0-rc.1" }
nmp-nip51 = { path = "../nmp-nip51", optional = true, version = "1.0.0-rc.1" }
nmp-nip57 = { path = "../nmp-nip57", optional = true, default-features = false, version = "1.0.0-rc.1" }
nmp-marmot = { path = "../nmp-marmot", optional = true, version = "1.0.0-rc.1" }
nmp-intent = { path = "../nmp-intent", version = "1.0.0-rc.1" }
nmp-signer-iface = { path = "../nmp-signer-iface", optional = true, version = "1.0.0-rc.1" }
nmp-signers = { path = "../nmp-signers", optional = true, version = "1.0.0-rc.1" }
nostr = { workspace = true, features = ["nip44", "nip59"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tracing = "0.1"
zeroize = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-nip23 = { path = "../nmp-nip23" }
nmp-nip29 = { path = "../nmp-nip29" }
