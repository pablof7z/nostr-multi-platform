[package]
name = "nmp-content-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline signed-event + pre-tokenized DTO bundle generator (pre-T93 staging format; NmpGallery showcase deleted in T111 closure). Retained as test-fixture generator for nmp-content scenarios."

[lib]
name = "nmp_content_fixtures"

[[bin]]
name = "build-bundle"
path = "src/bin/build-bundle.rs"

[[bin]]
name = "build-wire-fixtures"
path = "src/bin/build-wire-fixtures.rs"

[[bin]]
name = "build-android-gallery-bundle"
path = "src/bin/build-android-gallery-bundle.rs"

[dependencies]
nmp-content = { path = "../nmp-content" }
nmp-core = { path = "../nmp-core" }
nmp-signer-iface = { path = "../nmp-signer-iface" }
# Direct dep on nmp-store for RawEvent / VerifiedEvent — the nmp_core::store
# compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store" }
# Deterministic BIP340 schnorr signing for reproducible fixture bundles
# (`sign_schnorr_no_aux_rand`); no relay/networking features needed.
nostr = { workspace = true, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
nmp-core = { path = "../nmp-core" }
