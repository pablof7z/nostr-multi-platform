[package]
name = "nmp-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NMP testing harnesses, doctrine lint gates, mock relays, and release validation utilities."

[features]
# Enable LMDB-backed store tests. Passes through to nmp-core's lmdb-backend feature.
lmdb-backend = ["nmp-core/lmdb-backend"]
# Enable real-relay integration tests (A1-A6 relay-search-radius acceptance suite).
# These tests open live WebSocket connections and are excluded from the default
# scoped-test path.  Run explicitly:
#   cargo test -p nmp-testing --features real-relay --test <name> -- --ignored --nocapture
real-relay = []

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", features = ["test-support"], version = "1.0.0-rc.1" }
# Direct dep on nmp-planner for InterestId / InterestLifecycle / InterestScope /
# LogicalInterest / CompiledPlan / RelayPlan / RelayAttribution — the
# nmp_core::planner compat facade is deleted (#1608).
nmp-planner = { path = "../nmp-planner", version = "1.0.0-rc.1" }
# Direct dep on nmp-store for RawEvent / VerifiedEvent / EventStore /
# InsertOutcome / MemEventStore — the nmp_core::store compat facade is
# deleted (#1608). The lib src (store_harness.rs) uses these types.
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
nmp-feed = { path = "../nmp-feed", version = "1.0.0-rc.1" }
nmp-native-runtime = { path = "../nmp-native-runtime", features = ["test-support", "signer-broker"], version = "1.0.0-rc.1" }
nostr = { version = "0.44", features = ["std", "nip04", "nip44"] }
paste = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustls = { workspace = true, default-features = false, features = ["ring"] }
tungstenite = { workspace = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# ffi-transport-bench: links the REAL uniffi_core runtime crate to exercise
# the genuine RustBuffer lowering path (FfiConverter::lower) for Vec<u8>.
# No generated bindings are produced; uniffi_core is a pure Rust library dep.
uniffi_core = "0.29"

[dev-dependencies]
nmp-core = { path = "../nmp-core" }
trellis-core = "0.2.1"
trellis-testing = "0.2.1"
# Direct dev dep on nmp-planner for InterestId / InterestLifecycle / etc. in
# integration tests — nmp_core::planner compat facade deleted (#1608).
nmp-planner = { path = "../nmp-planner" }
# Direct dev dep on nmp-store for RawEvent / VerifiedEvent / EventStore in
# integration tests — nmp_core::store compat facade deleted (#1608).
nmp-store = { path = "../nmp-store" }
# dx_login_timeline_gate.rs — the canonical DX worked example (aim.md §1 proof).
# `harness` pulls in the headless host driver that drives login → following
# timeline → live update through the real kernel.
nmp-example-login-timeline = { path = "../nmp-example-login-timeline", features = ["harness"] }
# longform_projection_supersession.rs — drives the typed NIP-23
# `LongformProjection` against the real event store to prove kernel-resolved
# kind:30023 supersession (param-replaceable C2) reaches the typed projection.
# NIP-19 entity codec (Layer 4), used by relay_search integration test. Issue #2515.
nmp-nostr-id = { path = "../nmp-nostr-id" }
zeroize = { workspace = true }
nmp-feed = { path = "../nmp-feed" }
nmp-note-feed = { path = "../nmp-note-feed" }
nmp-nip01 = { path = "../nmp-nip01" }
# #1740 step 3 perspective-compiler fixture: prove per-scope admission with the
# real resolution projections (no duplicated graph/list parsing — D4).
nmp-nip02 = { path = "../nmp-nip02" }
nmp-wot = { path = "../nmp-wot" }
nmp-nip17 = { path = "../nmp-nip17", features = ["test-support"] }
nmp-nip18 = { path = "../nmp-nip18" }
nmp-nip09 = { path = "../nmp-nip09" }
nmp-nip23 = { path = "../nmp-nip23" }
nmp-nip68 = { path = "../nmp-nip68" }
nmp-nip42 = { path = "../nmp-nip42" }
# #1811 cache-FTS integration gate (cache_fts_integration_gate.rs) — drives the
# crate-owned NIP-50 public search scopes + NIP-29 group-metadata scope through
# the real `SearchScopeRegistry::compile`/`install_into` seam against both store
# backends (mem + LMDB) to prove early-stop bounds, privacy exclusion, cleanup
# on delete/replace/kind:5/GC, CacheOnly relay-silence, and mem↔lmdb parity.
nmp-nip50 = { path = "../nmp-nip50" }
nmp-nip29 = { path = "../nmp-nip29" }
nmp-nip84 = { path = "../nmp-nip84" }
nmp-substrate = { path = "../nmp-substrate" }
nmp-nip59 = { path = "../nmp-nip59" }
# cold_start_demand_interest.rs — drives the real substrate +
# bookmark-runtime owners to capture the `BookmarkListProjection` handle and
# assert the typed NIP-51 kind:10003 snapshot surfaces a stored bookmark via
# cold-start cache-serve on sign-in, with no relay delivery.
nmp-nip51 = { path = "../nmp-nip51" }
nmp-codegen = { path = "../nmp-codegen" }
# V-51 phase 4 validation harness — `routing_trace_real_nostr` test
# constructs `GenericOutboxRouter` + `InMemoryMailboxCache` + the
# `Kind10002Parser` directly to seed the cache from a live kind:10002
# fetch, then observes via a kernel-side `RoutingTraceProjection`.
nmp-router = { path = "../nmp-router" }
nmp-signers = { path = "../nmp-signers" }
nmp-signer-iface = { path = "../nmp-signer-iface" }
# NIP-46 reconnect-ordering integration test (#2119): pool API + session reducer.
nmp-network = { path = "../nmp-network", features = ["native"] }
nmp-nip46 = { path = "../nmp-nip46" }
# T121 — actor-lane sign-ready end-to-end test (#2119 PR-B1).
nmp-nip46-runtime = { path = "../nmp-nip46-runtime" }
# Real-relay smoke test dependencies (real_relay_smoke.rs).
# NIP-46 mock-bunker integration test (nip46_bunker_signing.rs) needs nip04/nip44.
nostr = { version = "0.44", features = ["std", "nip04", "nip44"] }
rustls = { workspace = true, default-features = false, features = ["ring"] }
tungstenite = { workspace = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Marmot exit-gate integration tests (marmot_*.rs).
# nmp-marmot drives MarmotService; test-utils gates new_unencrypted / new_in_memory.
# mdk-core exposes MessageProcessingResult + NostrGroupConfigData + GroupId for assertions.
# tempfile provides ephemeral SQLite paths for state-fork (post-compromise test).
nmp-marmot = { path = "../nmp-marmot" }
mdk-core = "0.8.0"
mdk-sqlite-storage = { version = "0.8.0", features = ["test-utils"] }
tempfile = "3"
# Relay-search-radius acceptance tests (A1-A6) capture stderr using FD-level
# pipe/dup2 to intercept the NMP_CLAIM_LOG structured output from actor threads.
libc = "0.2"
# Kernel ingest allocation gate (#2798). Test-only heap profiler.
dhat = "0.3.3"

# SLICE-NS-M14-002 (#2388) — FFI transport A/B microbench comparing the C-lane
# (extern "C" ptr/len + shell copy) against the UniFFI lane (real RustBuffer
# lowering via uniffi_core + foreign-trait vtable dispatch + lower-bound
# foreign-consume stub).  Reports p50/p95/p99 per bucket + weighted-p99 delta
# + pre-registered COLLAPSE/ESCALATE/KEEP-INTERNAL verdict.
# Run: cargo run -p nmp-testing --bin ffi-transport-bench --release -- --standard
[[bin]]
name = "ffi-transport-bench"
path = "bin/ffi-transport-bench/main.rs"

# Doctrine-lint — D0+D6+D7+D8 grep gates (Tier 1 item #8 from
# docs/perf/parallel-work-brainstorm-2026-05-18.md). Grep-based static
# analyzer with `#[cfg(test)]` module tracking; runs in CI on push +
# pull_request via `.github/workflows/doctrine-lint.yml`.
# `cargo run -p nmp-testing --bin doctrine-lint -- --crate nmp-core`
[[bin]]
name = "doctrine-lint"
path = "bin/doctrine-lint/main.rs"

# Issue #1522 -- LMDB cache query_visit regression fixtures (baseline before #1516).
# cargo test -p nmp-testing --features lmdb-backend --test store_cache_baseline
[[test]]
name = "store_cache_baseline"
path = "tests/store_cache_baseline.rs"
required-features = ["lmdb-backend"]

# Epic #1523 acceptance gate: materialization regression (LMDB streaming).
# Proves that early ControlFlow::Break stops conversion immediately.
# cargo test -p nmp-testing --features lmdb-backend --test cache_no_materialization_gate
[[test]]
name = "cache_no_materialization_gate"
path = "tests/cache_no_materialization_gate.rs"
required-features = ["lmdb-backend"]

# Epic #1523 acceptance gate: Mem ≡ LMDB parity fixtures.
# Runs the same fixtures against both backends via for_each_backend!.
# cargo test -p nmp-testing --test cache_serve_replay_fixtures
# cargo test -p nmp-testing --features lmdb-backend --test cache_serve_replay_fixtures
[[test]]
name = "cache_serve_replay_fixtures"
path = "tests/cache_serve_replay_fixtures.rs"

# Doctrine-lint smoke test — runs the binary against fixtures under
# bin/doctrine-lint/fixtures/ and asserts pass/fail per rule.
# `cargo test -p nmp-testing --test doctrine_lint_smoke`
[[test]]
name = "doctrine_lint_smoke"
path = "bin/doctrine-lint/tests.rs"

[[test]]
name = "kernel_ingest_allocation_gate"
path = "tests/kernel_ingest_allocation_gate.rs"

[[test]]
name = "doctrine_native_smoke"
path = "bin/doctrine-lint/native_tests.rs"

# M2 subscription compiler audit gate — Assertions 1–5 (phase 1 subset).
# `cargo test -p nmp-testing --test m2_subscription_compilation_audit`
[[test]]
name = "m2_subscription_compilation_audit"
path = "tests/m2_subscription_compilation_audit.rs"

# M8-subs — subscription lifecycle integration tests (Task #46).
# Pins the seam between M2's CompiledPlan and the wire: registry, trigger
# inbox, wire-emitter, connection pool. Eight M8 subscription-lifecycle
# contracts owned by the test file itself.
# `cargo test -p nmp-testing --test m8_subscription_lifecycle`
[[test]]
name = "m8_subscription_lifecycle"
path = "tests/m8_subscription_lifecycle.rs"

# NIP-29 public-runtime discovery smoke. Hermetic local relay, no network.
# `cargo test -p nmp-testing --test nip29_discovery_runtime_smoke`
[[test]]
name = "nip29_discovery_runtime_smoke"
path = "tests/nip29_discovery_runtime_smoke.rs"

# Framework magic contract — 13 behaviour tests (C1-C13) + coverage meta-test.
# Cross-cutting; intentionally not milestone-prefixed.
# `cargo test -p nmp-testing --test framework_magic_contract`
[[test]]
name = "framework_magic_contract"
path = "tests/framework_magic_contract.rs"

# T66 pulse-builder — real-relay smoke for Nip65OutboxResolver + kind:1 round-trip.
# All tests `#[ignore]` by default; run explicitly:
#   cargo test -p nmp-testing --test real_relay_smoke -- --ignored --nocapture
[[test]]
name = "real_relay_smoke"
path = "tests/real_relay_smoke.rs"

# NIP-17 gift-wrap round-trip over a real relay using the pure
# `nmp_nip59::gift_wrap_local` composition (Alice publishes from one
# socket; Bob subscribes on a separate socket and decrypts).
# `#[ignore]` by default; run explicitly:
#   cargo test -p nmp-testing --test real_relay_nip17_roundtrip -- --ignored --nocapture
[[test]]
name = "real_relay_nip17_roundtrip"
path = "tests/real_relay_nip17_roundtrip.rs"

# Higher-order NIP-50 search — drives the `nmp_nip50` SearchResultsProjection
# against a LIVE search relay (search.nos.lol) for kind:0 (Users) and kind:30023
# (LongForm). Proves the generic `InterestShape.search` wire field + the dedup
# projection ingest real relay hits end-to-end. `#[ignore]` by default AND
# gated behind `real-relay` (same posture as A1-A6) so CI stays deterministic:
#   cargo test -p nmp-testing --features real-relay --test real_relay_nip50_search \
#     -- --ignored --nocapture
[[test]]
name = "real_relay_nip50_search"
path = "tests/real_relay_nip50_search.rs"
required-features = ["real-relay"]

# NIP-29 discovery through the public native-runtime path against a real relay.
# `#[ignore]` by default and gated behind `real-relay` so CI stays hermetic:
#   cargo test -p nmp-testing --features real-relay --test real_relay_nip29_discovery \
#     -- --ignored --nocapture
[[test]]
name = "real_relay_nip29_discovery"
path = "tests/real_relay_nip29_discovery.rs"
required-features = ["real-relay"]

# F-02 cold-start DM receive-side verification (issue #977).
# Alice publishes a kind:1059 gift-wrap while Bob is offline; Bob cold-starts a
# fresh DmInboxProjection and must receive the stored event via EOSE backfill.
# Two variants: nak-serve (deterministic) and relay.damus.io (live).
# `#[ignore]` by default; run explicitly:
#   cargo test -p nmp-testing --test real_relay_nip17_cold_start -- --ignored --nocapture
[[test]]
name = "real_relay_nip17_cold_start"
path = "tests/real_relay_nip17_cold_start.rs"

# F-02 CLOSURE GATE (issue #977) — cold-start DM receive driven through a REAL
# `NmpApp`/Kernel. Unlike `real_relay_nip17_cold_start` (which drives the
# projection directly), this test makes the kernel itself compile and emit the
# kind:1059 #p REQ via the kind:10050 → DmRelayCache routing path, ingest the
# relay backfill through its Schnorr-verify + store gate, and surface the DM in
# the `nmp.nip17.dm_inbox` snapshot. `#[ignore]` (needs `nak` on $PATH):
#   cargo test -p nmp-testing --test real_relay_nip17_cold_start_kernel \
#     -- nip17_cold_start_receive_through_real_kernel --ignored --nocapture
[[test]]
name = "real_relay_nip17_cold_start_kernel"
path = "tests/real_relay_nip17_cold_start_kernel.rs"

