# `cargo test -p nmp-testing --test nip46_req_before_event_on_reconnect`
[[test]]
name = "nip46_req_before_event_on_reconnect"
path = "tests/nip46_req_before_event_on_reconnect.rs"

# T121 — NIP-46 actor-lane sign-ready end-to-end (#2119 PR-B1).
