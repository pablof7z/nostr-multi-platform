[package]
name = "nmp-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NMP code generator for typed projection decoders, projection caches, action builders, feed helpers, and release drift gates."

[lib]
name = "nmp_codegen"

[[bin]]
name = "nmp-codegen"
path = "src/main.rs"

[dependencies]
nmp-ownership = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
