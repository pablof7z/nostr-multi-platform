# PARKED — no in-tree consumer; intended for an external iOS notification-service
# extension that links this crate as a staticlib (issue #2289). Not a member of
# the default workspace build (see top-level Cargo.toml [workspace] exclude).
# Compile on demand:
#   cargo build --manifest-path crates/nmp-nip59-decrypt-only/Cargo.toml
# Remove from exclude and add back to [workspace] members when #2289 is wired up.
#
# PARKED != UNMONITORED: .github/workflows/parked-crates.yml runs
# `cargo check --all-targets` against this manifest on every push to master
# and on any PR touching crates/nmp-nip59* paths, so nmp-nip59 API drift fails
# CI here instead of rotting silently while the crate sits out of the
# workspace (decision recorded on #2769).
#
# This empty `[workspace]` table makes the parked crate its OWN workspace root.
# Without it, Cargo's workspace auto-discovery walks UP the directory tree and
# binds this crate to the monorepo root manifest — which `exclude`s it —
# producing `current package believes it's in a workspace when it's not` errors.
# Declaring an empty workspace stops the upward walk so the crate resolves on its
# own while its `path = "../nmp-nip59"` dep still points at the same monorepo crate.
[workspace]

[package]
name = "nmp-nip59-decrypt-only"
version = "0.8.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/pablof7z/nostr-multi-platform"
description = "Minimal NIP-59 gift-wrap unwrap crate for notification-service targets. No actor, storage, relay, or nmp-core linkage."

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
nmp-nip59 = { path = "../nmp-nip59", default-features = false, features = ["std"] }
nostr = { version = "0.44", default-features = false, features = ["std", "nip44", "nip59"] }

[dev-dependencies]
nmp-nip59 = { path = "../nmp-nip59", features = ["std", "wrap"] }
nostr = { version = "0.44", default-features = false, features = ["std", "nip44", "nip59"] }
