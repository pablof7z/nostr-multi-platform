[package]
name = "nmp-content"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Layer A content-rendering substrate — tokenizer, embed claim registry, recursion guard."

[lib]
name = "nmp_content"

[dependencies]
nmp-ownership = { workspace = true }
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-kinds = { path = "../nmp-kinds", version = "1.0.0-rc.1" }
# Canonical DeleteRecord (kind:5 decode) and AddressCoordinate (a-tag identity)
# for NIP-23 article delete-folding — nmp-nip18 is not the generic deletion
# owner (ADR-0074, widened by #2589).
nmp-nip09 = { path = "../nmp-nip09", version = "1.0.0-rc.1" }
nmp-nip01 = { path = "../nmp-nip01", version = "1.0.0-rc.1" }
nmp-nip84 = { path = "../nmp-nip84", version = "1.0.0-rc.1" }
# NIP-19 codec + NIP-21 `nostr:` URI vocabulary (Layer 0). The tokenizer,
# segment model, embed registry, and wire projection consume
# `nmp_nostr_id::{NostrUri, parse_nostr_uri, format_nostr_uri}`. Issue #2515.
nmp-nostr-id = { path = "../nmp-nostr-id", version = "1.0.0-rc.1" }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.11"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { version = "1.13", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
