[package]
name = "nmp-content"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Layer A content-rendering substrate — tokenizer, embed claim registry, recursion guard."

[lib]
name = "nmp_content"

[dependencies]
nmp-ownership = { workspace = true }
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false }
nmp-feed = { path = "../nmp-feed" }
nmp-kinds = { path = "../nmp-kinds" }
nmp-nip18 = { path = "../nmp-nip18" }
# NIP-19 codec + NIP-21 `nostr:` URI vocabulary (Layer 0). The tokenizer,
# segment model, embed registry, and wire projection consume
# `nmp_nostr_id::{NostrUri, parse_nostr_uri, format_nostr_uri}`. Issue #2515.
nmp-nostr-id = { path = "../nmp-nostr-id" }
nmp-planner = { path = "../nmp-planner" }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.11"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { version = "1.13", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
