[package]
name = "nmp-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI binding surface for the NMP native app lifecycle and byte action/update doorway (issue #2389, M14 scaffold)."

[lib]
name = "nmp_uniffi"
# cdylib: required for `uniffi-bindgen generate --library` (produces .dylib/.so).
# rlib: required for Rust `cargo test`.
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = [
    "nmp-native-runtime/native",
]
# Build the `uniffi-bindgen` binary to regenerate Swift/Kotlin bindings.
# NOT in `default` — keeps cold builds out of the 600s watchdog budget.
# Usage (macOS):
#   cargo build -p nmp-uniffi
#   cargo run -p nmp-uniffi --features bindgen --bin uniffi-bindgen -- \
#       generate --library target/debug/libnmp_uniffi.dylib \
#       --language swift --out-dir crates/nmp-uniffi/generated/swift/
# Note: uniffi 0.29 puts uniffi_bindgen_main behind the "cli" feature.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[dependencies]
nmp-native-runtime = { path = "../nmp-native-runtime", default-features = false }
nmp-core = { path = "../nmp-core", default-features = false }
nmp-content = { path = "../nmp-content" }
uniffi = { version = "0.29" }

[dev-dependencies]
# For building test envelopes and registering test action modules.
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-native-runtime = { path = "../nmp-native-runtime", features = ["test-support"] }
serde_json = { workspace = true }
