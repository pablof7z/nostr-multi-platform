[package]
name = "nmp-nip47"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-47 Nostr Wallet Connect — Layer-4 NIP crate. Owns the actor-side `WalletRuntime`, the `nmp.wallet.pay_invoice` `ActionModule`, and the three `ProtocolCommand` impls that replace the pre-V-38 `Wallet*` `ActorCommand` variants. After V-38 `nmp-core → nmp-nwc` is deleted — the dep direction inverts here."

[dependencies]
nmp-core = { path = "../nmp-core" }
nmp-signer-iface = { path = "../nmp-signer-iface" }
nmp-nwc = { path = "../nmp-nwc" }
# Direct dep on nmp-network for RelayRole — used by OutboundMessage and
# the NIP-47 wallet runtime.
nmp-network = { path = "../nmp-network" }
flatbuffers = { workspace = true }
nostr = { version = "0.44", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
# `native` pulls in the `__ffi_internal::ActionRegistry` seam the
# dispatch_integration test drives through `start_bytes` (ADR-0064 / #1756).
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
tempfile = "3"
