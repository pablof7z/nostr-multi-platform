[package]
name = "nmp-nip47"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-47 Nostr Wallet Connect — Layer-4 NIP crate. Owns the actor-side `WalletRuntime`, the `nmp.wallet.pay_invoice` `ActionModule`, and the three `ProtocolCommand` impls that replace the pre-V-38 `Wallet*` `ActorCommand` variants. After V-38 `nmp-core → nmp-nwc` is deleted — the dep direction inverts here."

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", version = "0.8.4" }
nmp-network = { path = "../nmp-network", default-features = false, version = "0.8.4" }
nmp-signer-iface = { path = "../nmp-signer-iface", version = "0.8.4" }
nmp-nwc = { path = "../nmp-nwc", version = "0.8.4" }
flatbuffers = { workspace = true }
nostr = { version = "0.44", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
# `native` pulls in the `__ffi_internal::ActionRegistry` seam the
# dispatch_integration test drives through `start_bytes` (ADR-0071 / #1756).
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
tempfile = "3"
