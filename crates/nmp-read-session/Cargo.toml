[package]
name = "nmp-read-session"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Concept-neutral read-lifecycle engine: one open/replace/close registry, replay-before-live ordering, exact-demand withdrawal, reverse teardown, and typed-output tombstone behind every concept-owned active read."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-planner = { path = "../nmp-planner", default-features = false, version = "1.0.0-rc.1" }
nmp-ownership = { workspace = true }
# #3116 — the demand-set engine applies `nmp_core::trellis_reconciler`'s
# ordered `ResourceCommand<ReadDemand>` plan directly (`demand_set.rs`).
# External leaf crate (no NMP-graph edge); the ADR-level tradeoff (transitive
# compile weight) mirrors the one already accepted for `nmp-core` itself.
trellis-core = "0.2.1"

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
