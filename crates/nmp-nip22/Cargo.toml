[package]
name = "nmp-nip22"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-22 comment (kind:1111) decode, builder, and threaded comment projection for NMP apps."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "0.8.4" }
nmp-signer-iface = { path = "../nmp-signer-iface", version = "0.8.4" }
nmp-kinds = { path = "../nmp-kinds", version = "0.8.4" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
