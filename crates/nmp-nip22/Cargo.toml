[package]
name = "nmp-nip22"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-22 comment (kind:1111) decode, builder, and threaded comment projection for NMP apps."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
# The `nip22.root` composite-feed lane mapping (#3082) — a pure
# `KernelEvent -> Vec<MappedRow>` extractor over nmp-feed's generic types.
# nmp-feed sits BELOW this crate (it does not depend on any NIP crate), so
# this is not a cycle.
nmp-feed = { path = "../nmp-feed", version = "1.0.0-rc.1" }
nmp-signer-iface = { path = "../nmp-signer-iface", version = "1.0.0-rc.1" }
nmp-kinds = { path = "../nmp-kinds", version = "1.0.0-rc.1" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
