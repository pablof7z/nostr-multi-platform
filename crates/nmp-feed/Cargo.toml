[package]
name = "nmp-feed"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Reusable bounded Nostr feed windowing, cursor paging, and feed controller registry for NMP apps."

[dependencies]
nmp-ownership = { workspace = true }
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
# Direct dep on nmp-planner for InterestShape / RelayHint — the
# nmp_core::planner compat facade is deleted (#1608).
nmp-planner = { path = "../nmp-planner", default-features = false, version = "1.0.0-rc.1" }
# The ONE read-lifecycle engine (#2777). The feed-session registry is feed's
# typed door onto it; there is no second lifecycle implementation.
nmp-read-session = { path = "../nmp-read-session", version = "1.0.0-rc.1" }
# Direct dep on nmp-store for LogOp / ScanLogResult / StoreLogEntry / PullPage
# / PullGap / RawEvent / DeleteReason — the nmp_core::store compat facade is
# deleted (#1608).
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
nmp-threading = { path = "../nmp-threading", version = "1.0.0-rc.1" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
