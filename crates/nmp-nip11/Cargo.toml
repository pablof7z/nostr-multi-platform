[package]
name = "nmp-nip11"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-11 relay information documents as an NMP protocol crate — automatic fetch on relay connect + on-demand probe, surfaced through the relay diagnostics projection. nmp-core learns no NIP-11 noun and imports no HTTP crate (D0)."

[dependencies]
nmp-ownership = { workspace = true }
# Substrate seams: RelayConnectedHook slot, ActorCommand::SetRelayInfo,
# the RelayInfoDoc carried-through type.
nmp-core = { path = "../nmp-core", version = "0.8.4" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Off-thread HTTP GET. Same crate + feature set as nmp-nip57's LNURL fetcher
# and nmp-blossom's upload PUT — runs on a `std::thread::spawn` worker, never
# the actor thread (D8). Not a wasm dependency; excluded from wasm32 targets.
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
serde_json = { workspace = true }
