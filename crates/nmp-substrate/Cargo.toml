[package]
name = "nmp-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned NMP substrate construction: router/mailbox/parser/publish resolver/coverage wiring."

[features]
default = ["native"]
native = [
    "dep:nmp-nip11",
    "nmp-core/native",
    "nmp-router/native",
]

[dependencies]
nmp-coverage-gate = { path = "../nmp-coverage-gate", version = "1.0.0-rc.1" }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-ownership = { workspace = true }
nmp-nip11 = { path = "../nmp-nip11", optional = true, version = "1.0.0-rc.1" }
nmp-nip01 = { path = "../nmp-nip01", default-features = false, version = "1.0.0-rc.1" }
nmp-nip51 = { path = "../nmp-nip51", version = "1.0.0-rc.1" }
nmp-nip77 = { path = "../nmp-nip77", version = "1.0.0-rc.1" }
nmp-router = { path = "../nmp-router", default-features = false, version = "1.0.0-rc.1" }
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
