[package]
name = "nmp-nip50"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-50 search request and result-projection primitives for NMP. Core/planner carry the generic search filter; this crate owns NIP-50 search semantics."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
# Direct dep on nmp-store for the FTS seam (text_search_visit / TextSearchQuery /
# SearchScopeId / StoredEvent / SearchField) the cache-search path and scope
# providers build against. #1811.
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
nmp-read-session = { path = "../nmp-read-session", version = "1.0.0-rc.1" }
# Direct dep on nmp-planner for bounded_search_query / InterestShape —
# the nmp_core::planner compat facade is deleted (#1608).
nmp-planner = { path = "../nmp-planner", version = "1.0.0-rc.1" }
nmp-kinds = { path = "../nmp-kinds", version = "1.0.0-rc.1" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# S9 typed FlatBuffers sidecar for the SearchResultsSnapshot projection
# (ADR-0072). The serde JSON shape stays the in-crate authority; this is the
# language-neutral typed payload the host platforms decode.
flatbuffers = { workspace = true }

[dev-dependencies]
# `test-support` exposes `VerifiedEvent::from_raw_unchecked` so the cache-hit
# projection tests can seed a `MemEventStore` with synthetic events and drive
# the real FTS seam end-to-end. #1811.
nmp-store = { path = "../nmp-store", features = ["test-support"] }
