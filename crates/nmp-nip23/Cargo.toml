[package]
name = "nmp-nip23"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NIP-23 long-form article projections and feed semantics for NMP."

[lib]
name = "nmp_nip23"

[dependencies]
nmp-ownership = { workspace = true }
flatbuffers = { workspace = true }
nmp-content = { path = "../nmp-content", version = "0.8.4" }
nmp-core = { path = "../nmp-core", default-features = false, version = "0.8.4" }
nmp-feed = { path = "../nmp-feed", version = "0.8.4" }
nmp-kinds = { path = "../nmp-kinds", version = "0.8.4" }
nmp-nip09 = { path = "../nmp-nip09", version = "0.8.4" }
nmp-nip18 = { path = "../nmp-nip18", version = "0.8.4" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
