[package]
name = "nmp-note-feed"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Reusable note-feed composition: OP/flat feed projections that compose NIP-01, NIP-10, and NIP-18 facts into typed feed rows."

[dependencies]
flatbuffers = { workspace = true }
nmp-content = { path = "../nmp-content", version = "0.8.4" }
nmp-core = { path = "../nmp-core", default-features = false, version = "0.8.4" }
nmp-feed = { path = "../nmp-feed", version = "0.8.4" }
nmp-nip01 = { path = "../nmp-nip01", version = "0.8.4" }
# Canonical DeleteRecord (kind:5 decode) for kind:1 note delete-folding —
# nmp-nip18 is not the generic deletion owner (ADR-0074, widened by #2589).
nmp-nip09 = { path = "../nmp-nip09", version = "0.8.4" }
nmp-nip18 = { path = "../nmp-nip18", version = "0.8.4" }
nmp-ownership = { workspace = true }
nmp-planner = { path = "../nmp-planner", default-features = false, version = "0.8.4" }
nmp-threading = { path = "../nmp-threading", version = "0.8.4" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
