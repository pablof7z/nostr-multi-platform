[package]
name = "nmp-nip51"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-51 list projections for NMP: mute suppression, global bookmarks, bookmark/curation sets, web bookmarks, and search-relay facts. Protocol parsing stays here; generic routing/search policy stays in substrate/search owners."

[lib]
crate-type = ["rlib"]

[dependencies]
# `nmp-core` supplies `ObservedProjectionSink` (the ingest seam) and
# `SuppressionLookup` (the substrate-generic trait the timeline projection
# reads). No NIP nouns enter nmp-core through this crate.
nmp-core = { path = "../nmp-core", default-features = false }
nmp-ownership = { workspace = true }
nmp-signer-iface = { path = "../nmp-signer-iface" }
# Direct dep on nmp-planner for InterestId / InterestScope / InterestLifecycle /
# LogicalInterest / PTagRouting / stable_hash64 — used by `interests.rs` for
# the bookmark-list and mute-list interest builders (mirrors nmp-nip57/Cargo.toml).
nmp-planner = { path = "../nmp-planner", default-features = false }
# Layer-0 kind-constant registry — re-exports NIP-51 kind integers
# so this crate no longer duplicates those values.
nmp-kinds = { path = "../nmp-kinds" }
# NIP-50 owns search relay-selection semantics. The NIP-51 runtime installs a
# source backed by the active account's kind:10007 projection.
nmp-nip50 = { path = "../nmp-nip50" }
nmp-store = { path = "../nmp-store" }
trellis-core = "0.1.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Typed FlatBuffers sidecar (ADR-0037) for the `nmp.nip51.mute_list` projection.
# Runtime pin is workspace-wide and guarded by
# ci/check-flatbuffers-version-pins.sh.
flatbuffers = { workspace = true }

[dev-dependencies]
# `native` pulls in the `__ffi_internal::ActionRegistry` seam the
# dispatch_integration test drives through `start_bytes` (ADR-0064 / S9 #1747).
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
# Integration test: wire MuteListProjection into ModularTimelineProjection
nmp-nip01 = { path = "../nmp-nip01" }
nmp-threading = { path = "../nmp-threading" }
# dispatch_integration seeds a kind:10003 KernelEvent (KIND_BOOKMARK_LIST) so the
# remove_bookmark presence check has an existing bookmark to find.
nmp-kinds = { path = "../nmp-kinds" }
nostr = { version = "0.44", default-features = false, features = ["std"] }
