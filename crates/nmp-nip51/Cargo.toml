[package]
name = "nmp-nip51"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-51 list projections for NMP: kind:10000 public mute suppression, kind:10003 bookmark facts/builders, and kind:10007 active-account search-relay facts. Protocol parsing stays here; generic routing/search policy stays in substrate/search owners."

[lib]
crate-type = ["rlib"]

[dependencies]
# `nmp-core` supplies `KernelEventObserver` (the ingest seam) and
# `SuppressionLookup` (the substrate-generic trait the timeline projection
# reads). No NIP nouns enter nmp-core through this crate.
nmp-core = { path = "../nmp-core", default-features = false }
# Direct dep on nmp-planner for InterestId / InterestScope / InterestLifecycle /
# LogicalInterest / PTagRouting / stable_hash64 — used by `interests.rs` for
# the bookmark-list and mute-list interest builders (mirrors nmp-nip57/Cargo.toml).
nmp-planner = { path = "../nmp-planner", default-features = false }
# Layer-0 kind-constant registry — re-exports NIP-51 kind integers
# so this crate no longer duplicates those values.
nmp-kinds = { path = "../nmp-kinds" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Typed FlatBuffers sidecar (ADR-0037) for the `nmp.nip51.mute_list` projection.
# Runtime pin is workspace-wide and guarded by
# ci/check-flatbuffers-version-pins.sh.
flatbuffers = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
# Integration test: wire MuteListProjection into ModularTimelineProjection
nmp-nip01 = { path = "../nmp-nip01" }
nmp-threading = { path = "../nmp-threading" }
