[package]
name = "nmp-planner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Subscription compiler: LogicalInterest, mailbox cache, lattice merge rules, per-relay plan projection. Extracted from nmp-core (see docs/architecture/crate-boundaries.md §9)."

[lib]
name = "nmp_planner"
path = "src/lib.rs"

[dependencies]
# nmp-planner is a Layer-2 foundation crate (per the crate-boundary spec): it
# must NOT depend on nmp-core. The `stable_hash` helper that previously lived
# in `nmp-core::stable_hash` moved into this crate at extraction time —
# nmp-core now re-exports it from `nmp_planner::stable_hash` so existing
# `use nmp_core::stable_hash::stable_hash64` paths keep working without
# creating a circular dependency.
#
# `nmp-relay-url` is a Layer-0 (vocabulary) crate — depending on it does NOT
# violate the layer rule (Layer 2 may depend on Layer 0). It is the single
# relay-URL canonicalization authority, so the planner shares one normalization
# with the kernel/router instead of carrying its own copy (#967).
nmp-relay-url = { path = "../nmp-relay-url" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
