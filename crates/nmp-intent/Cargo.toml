[package]
name = "nmp-intent"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Input-intent resolver for NMP (#1804). Higher-order orchestrator: turns one untyped input string into a classified intent (direct reference / relay URL / NIP-05 shape / free-text search / registered recognizer). The recognizer trait + registry live noun-free in nmp-core::substrate::intent; this crate owns the orchestrator + generic parsers."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core" }
# NIP-19/21 entity codec (Layer 0) carved out of nmp-core per issue #2515.
nmp-nostr-id = { path = "../nmp-nostr-id" }
# NIP-50 search request shape — the orchestrator serializes a `SearchRequest`
# into the opaque `InputIntentTarget::TextQuery { request_json }` so nmp-core
# stays noun-free.
nmp-nip50 = { path = "../nmp-nip50" }
# NIP-05 canonical shape parser. The classifier's NIP-05 rung DEFERS to
# `parse_nip05` (default features — pure shape only, no `native` HTTP) so its
# accept set is identical to the dispatch-layer resolver's (#1882: no silent
# no-op). Mirrors the nmp-nip50 dependency above.
nmp-nip05 = { path = "../nmp-nip05" }
serde_json = { workspace = true }
