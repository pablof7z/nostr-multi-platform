[package]
name = "nmp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NMP developer CLI: scaffold apps (thin composition shells over nmp-defaults), install app-owned components, and inspect/upgrade the NMP dependency policy."

# The user-facing developer command is `nmp`. `nmp init` scaffolds a new app as
# a thin composition shell over `nmp-defaults` (ADR-0046 — composition is a
# library, not a generator). See docs/cli.md for the relationship to the
# `nmp-codegen` binary that ships the Swift CI-gated emitters.
[[bin]]
name = "nmp"
path = "src/main.rs"

[dependencies]
nmp-ownership = { workspace = true }
nmp-codegen = { path = "../nmp-codegen" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
sha2 = "0.10"
