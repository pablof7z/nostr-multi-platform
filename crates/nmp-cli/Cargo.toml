[package]
name = "nmp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NMP developer CLI: scaffold apps as explicit owner-crate composition shells, install app-owned components, and inspect/upgrade the NMP dependency policy."

# The user-facing developer command is `nmp`. `nmp init` scaffolds a new app as
# a thin composition shell that calls owner crates directly (ADR-0046 —
# composition is explicit Rust, not a generator). See docs/cli.md for the
# relationship to the `nmp-codegen` binary that ships the Swift CI-gated emitters.
[[bin]]
name = "nmp"
path = "src/main.rs"

[dependencies]
nmp-ownership = { workspace = true }
nmp-codegen = { path = "../nmp-codegen" }
nmp-component-registry = { path = "../nmp-component-registry" }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
sha2 = "0.10"
