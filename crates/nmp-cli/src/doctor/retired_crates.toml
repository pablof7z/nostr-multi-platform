# Vendored copy of release/nmp-release.toml's [[retired_crates]] entries.
#
# This crate is published to crates.io, and a published crate cannot
# `include_str!` a file outside its own directory (cargo only packages files
# within the crate root). The canonical source of truth stays
# release/nmp-release.toml; this copy is checked for drift by
# crates/nmp-cli/tests/retired_crates_sync.rs, which runs in normal
# workspace CI (not during `cargo publish`'s build-only verification).

[[retired_crates]]
name = "nmp-ffi"
migration = "migrate native entrypoints to app-owned facade crates over nmp-native-runtime / nmp-uniffi-support"

[[retired_crates]]
name = "nmp-defaults"
migration = "move product defaults into the app composition crate; NMP no longer ships a canonical preset crate"

[[retired_crates]]
name = "nmp-signer-broker"
migration = "use nmp-nip46-runtime and app-owned signer composition instead of the retired broker crate"

[[retired_crates]]
name = "nmp-wasm"
migration = "use nmp-browser-runtime for browser hosts; the monolithic nmp-wasm package is retired"

[[retired_crates]]
name = "nmp-uniffi"
migration = "use app-owned UniFFI facade crates plus nmp-uniffi-support; the shared facade crate is retired"
