[[components]]
id = "compose/content-kind-0"
version = "0.1.0"
target = "compose"
description = "Profile metadata (NIP-01, kind:0) embed renderer — avatar, display name, pubkey chip, NIP-05, and about preview."
dependencies = ["compose/content-kind-registry"]
