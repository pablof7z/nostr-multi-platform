# Split from registry.toml by platform target (file-size rule: 500 LOC hard
# ceiling). This file holds ONLY [[components]] blocks; schema_version and
# registry_id live in registry.toml. The loader merges registry.toml with
# every registry.<target>.toml in this directory (see REGISTRY_SECTION_FILES).

[[components]]
id = "compose/content-core"
version = "0.1.0"
target = "compose"
description = "Shared Compose renderer configuration + ContentTreeWire kotlinx.serialization mirror for app-owned Nostr content components."
[[components.files]]
source = "compose/content-core/NostrContentRenderer.kt"
target = "Components/NostrContent/NostrContentRenderer.kt"
role = "source"
[[components.files]]
source = "compose/content-core/ContentTreeWire.kt"
target = "Components/NostrContent/ContentTreeWire.kt"
role = "source"

[[components]]
id = "compose/content-mention-chip"
version = "0.1.0"
target = "compose"
description = "Tappable Compose profile mention chip with optional avatar and identicon fallback."
dependencies = ["compose/content-core"]
[[components.files]]
source = "compose/content-mention-chip/NostrMentionChip.kt"
target = "Components/NostrContent/NostrMentionChip.kt"
role = "source"

[[components]]
id = "compose/content-media-grid"
version = "0.1.0"
target = "compose"
description = "Compose photo-style media grid with 1/2/3/4+ layouts and +N more overlay."
dependencies = ["compose/content-core"]
[[components.files]]
source = "compose/content-media-grid/NostrMediaGrid.kt"
target = "Components/NostrContent/NostrMediaGrid.kt"
role = "source"

[[components]]
id = "compose/content-kind-registry"
version = "0.1.0"
target = "compose"
description = "Compose kind-dispatch registry for embedded Nostr events, including the embed chrome container, embedded-event composable, and default short-note/article/highlight/profile/unknown renderers."
dependencies = [
    "compose/content-core",
    "compose/user-avatar",
]
[[components.files]]
source = "compose/content-kind-registry/EmbedKindProjection.kt"
target = "Components/NostrContent/EmbedKindProjection.kt"
role = "source"
[[components.files]]
source = "compose/content-kind-registry/EmbedChromeContainer.kt"
target = "Components/NostrContent/EmbedChromeContainer.kt"
role = "source"
[[components.files]]
source = "compose/content-kind-registry/NostrKindRegistry.kt"
target = "Components/NostrContent/NostrKindRegistry.kt"
role = "source"
[[components.files]]
source = "compose/content-kind-registry/EmbeddedEvent.kt"
target = "Components/NostrContent/EmbeddedEvent.kt"
role = "source"

[[components]]
id = "compose/content-view"
version = "0.2.0"
target = "compose"
description = "Full Compose ContentTreeWire renderer covering all WireNode variants: inline runs (text/mention/hashtag/url/emoji/emphasis/strong/inline-code/link/soft+hard breaks), blocks (paragraph/heading/code/list/quote/rule/image), media, kind-dispatched event-ref embeds, and typed placeholders."
dependencies = [
    "compose/content-core",
    "compose/content-media-grid",
    "compose/content-kind-registry",
]
[[components.files]]
source = "compose/content-view/NostrContentView.kt"
target = "Components/NostrContent/NostrContentView.kt"
role = "source"
[[components.files]]
source = "compose/content-view/NostrContentGrouping.kt"
target = "Components/NostrContent/NostrContentGrouping.kt"
role = "source"

[[components]]
id = "compose/content-kind-30023"
version = "0.1.0"
target = "compose"
