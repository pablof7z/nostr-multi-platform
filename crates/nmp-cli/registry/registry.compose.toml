# -----------------------------------------------------------------------------
# Ratatui user profile widgets. `tui/user-avatar` accepts pubkeys through a
# `NostrProfileHost` adapter and owns the visible profile claim; host apps own
# keyboard actions, clipboard writes, terminal image protocols, and navigation.
# `tui/user-core` owns the shared `ProfileWire` mirror.
# -----------------------------------------------------------------------------
