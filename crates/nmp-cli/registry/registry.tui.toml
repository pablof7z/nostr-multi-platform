# -----------------------------------------------------------------------------
# Desktop (iced) user components.
# Mirror the TUI surface: `desktop/user-core` owns the shared `ProfileWire`
# mirror; the display widgets depend on it. `desktop/user-avatar` is
# self-contained (deterministic tint + image Handle, no ProfileWire). Host apps
# own image decoding (`iced::widget::image::Handle`), clipboard writes, and
# navigation.
# -----------------------------------------------------------------------------
