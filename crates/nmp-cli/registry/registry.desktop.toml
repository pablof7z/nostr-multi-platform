# Split from registry.toml by platform target (file-size rule: 500 LOC hard
# ceiling). This file holds ONLY [[components]] blocks; schema_version and
# registry_id live in registry.toml. The loader merges registry.toml with
# every registry.<target>.toml in this directory (see REGISTRY_SECTION_FILES).

[[components]]
id = "desktop/user-core"
version = "0.1.0"
target = "desktop"
description = "Shared iced ProfileWire mirror for Rust-owned user profile projections."
[[components.files]]
source = "desktop/user-core/profile_wire.rs"
target = "src/components/nostr_user/profile_wire.rs"
role = "source"

