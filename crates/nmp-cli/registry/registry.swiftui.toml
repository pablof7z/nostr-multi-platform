# -----------------------------------------------------------------------------
# SwiftUI user profile components. `swiftui/user-avatar` owns `ProfileWire`,
# so the smaller name / NIP-05 / npub / card components all depend on it.
# -----------------------------------------------------------------------------

[[components]]
id = "swiftui/user-avatar"
version = "0.1.0"
target = "swiftui"
description = "Reference-first Nostr avatar that claims its own profile projection and falls back to a deterministic identicon."
[[components.files]]
source = "swiftui/user-avatar/ProfileWire.swift"
target = "Components/NostrUser/ProfileWire.swift"
role = "source"
[[components.files]]
source = "swiftui/user-avatar/NostrProfileHost.swift"
target = "Components/NostrUser/NostrProfileHost.swift"
role = "source"
[[components.files]]
source = "swiftui/user-avatar/NostrAvatar.swift"
target = "Components/NostrUser/NostrAvatar.swift"
role = "source"

[[components]]
