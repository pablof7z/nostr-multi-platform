# Split from registry.toml by platform target (file-size rule: 500 LOC hard
# ceiling). This file holds ONLY [[components]] blocks; schema_version and
# registry_id live in registry.toml. The loader merges registry.toml with
# every registry.<target>.toml in this directory (see REGISTRY_SECTION_FILES).

[[components]]
id = "swiftui/content-core"
version = "0.2.0"
target = "swiftui"
description = "Shared SwiftUI renderer configuration + ContentTreeWire Codable mirror for app-owned Nostr content components."
[[components.files]]
source = "swiftui/content-core/NostrContentRenderer.swift"
target = "Components/NostrContent/NostrContentRenderer.swift"
role = "source"
[[components.files]]
source = "swiftui/content-core/ContentTreeWire.swift"
target = "Components/NostrContent/ContentTreeWire.swift"
role = "source"

[[components]]
id = "swiftui/render-identity"
version = "0.1.0"
target = "swiftui"
description = "RenderIdentifiable protocol and EquatableRow helper for SwiftUI row equatability optimization."
[[components.files]]
source = "swiftui/render-identity/RenderIdentifiable.swift"
target = "Components/SwiftUI/RenderIdentifiable.swift"
role = "source"

[[components]]
id = "swiftui/content-minimal"
version = "0.2.0"
target = "swiftui"
description = "Minimal SwiftUI Nostr content renderer with inline text, mentions, links, and hashtags."
dependencies = ["swiftui/content-core", "swiftui/render-identity"]
[[components.files]]
