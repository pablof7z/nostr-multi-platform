[package]
name = "nmp-nip29"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-29 relay-based groups as an NMP protocol crate. Owns every h-tagged event regardless of kind; declares host-relay-pinned routing via the third lane (Rule 9)."

[dependencies]
nmp-core = { path = "../nmp-core", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
# Direct dep on nmp-planner for InterestId / InterestLifecycle / InterestScope /
# LogicalInterest / stable_hash64 — the nmp_core::planner compat facade is
# deleted (#1608). nmp-planner is a Layer-2 foundation crate; it is already
# in the dep graph through nmp-core.
nmp-planner = { path = "../nmp-planner" }
# Direct dep on nmp-store for RawEvent / VerifiedEvent used in tests and
# action implementations — the nmp_core::store compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store" }
# Typed FlatBuffers sidecar codecs for the snapshot projections (ADR-0037).
# Workspace-pinned to 25.12.19, enforced by ci/check-flatbuffers-version-pins.sh.
flatbuffers = { workspace = true }
# `nostr::SingleLetterTag` to build the cache-only `StoreQuery::Tags { #h }` read
# that derives `["previous", …]` tags at publish time (action::publish).
nostr = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `native` enables `ActionRegistry` (via `__ffi_internal`) for the registry-level
# bad-version trip tests (ADR-0064 / S9 #1747). `test-support` enables store
# harness helpers.
# The NIP-29 read-view integration tests that drove an `NmpApp` (the typed
# sidecar + group-chat round-trip proofs) moved to `crates/nmp-ffi/tests` in the
# #2088 fix — the hydrating open/close composition is an `NmpApp` method that
# lives in `nmp-ffi`, so the tests live next to it. `nmp-nip29` no longer names
# `nmp-ffi` (and the dev-dep edge is dropped, keeping the dep graph clean).
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
nmp-store = { path = "../nmp-store", features = ["test-support"] }
