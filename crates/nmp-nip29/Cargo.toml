[package]
name = "nmp-nip29"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-29 relay-based groups as an NMP protocol crate. Owns every h-tagged event regardless of kind; declares host-relay-pinned routing via the third lane (Rule 9)."

[dependencies]
nmp-core = { path = "../nmp-core" }
# Direct dep on nmp-planner for InterestId / InterestLifecycle / InterestScope /
# LogicalInterest / stable_hash64 — the nmp_core::planner compat facade is
# deleted (#1608). nmp-planner is a Layer-2 foundation crate; it is already
# in the dep graph through nmp-core.
nmp-planner = { path = "../nmp-planner" }
# Direct dep on nmp-store for RawEvent / VerifiedEvent used in tests and
# action implementations — the nmp_core::store compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store" }
# `nmp-ffi` owns the `NmpApp` C-ABI handle (extracted from
# `nmp-core::ffi` in step 11-final). `register_actions` takes
# `&mut NmpApp`, so this crate names the handle through `nmp-ffi`.
nmp-ffi = { path = "../nmp-ffi" }
# Typed FlatBuffers sidecar codecs for the snapshot projections (ADR-0037).
# Workspace-pinned to 25.12.19, enforced by ci/check-flatbuffers-version-pins.sh.
flatbuffers = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-ffi = { path = "../nmp-ffi", features = ["test-support"] }
