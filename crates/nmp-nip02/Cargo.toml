[package]
name = "nmp-nip02"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-02 follow-list actions and projections for NMP apps."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
# `nmp-core` supplies the `ActionModule` / `ActionRegistrar` traits, the
# `ActorCommand` variants (`Follow`, `Unfollow`, `OpenInterest`,
# `CloseInterest` — kept generic in core per D0/D7), the substrate seams
# (`HostCapabilities`, `IdentityChangeRegistrar`, `SnapshotProjectionRegistrar`)
# the `register_follow_state_runtime` entry point uses, and the active-account
# / event-store slots the follow projections read.
nmp-core = { path = "../nmp-core", default-features = false }
nmp-store = { path = "../nmp-store" }
nmp-nip25 = { path = "../nmp-nip25" }
trellis-core = "0.1.2"
# Typed FlatBuffers codec for the `nmp.follow_list` snapshot sidecar (ADR-0072).
flatbuffers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-store = { path = "../nmp-store", features = ["test-support"] }
nmp-native-runtime = { path = "../nmp-native-runtime", features = ["test-support"] }
nmp-substrate = { path = "../nmp-substrate" }
nostr = { workspace = true, features = ["std"] }
