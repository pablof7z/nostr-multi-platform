[package]
name = "nmp-nip18"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-18 repost decoding and read-surfacing projections for NMP."

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false }
nmp-kinds = { path = "../nmp-kinds" }
# Canonical DeleteRecord (kind:5 decode) and AddressCoordinate (a-tag identity)
# — nmp-nip09 is the exclusive owner of the generic NIP-09 deletion grammar
# and the address-coordinate type it decodes (ADR-0074, widened by #2589).
nmp-nip09 = { path = "../nmp-nip09" }
nmp-planner = { path = "../nmp-planner", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
flatbuffers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
