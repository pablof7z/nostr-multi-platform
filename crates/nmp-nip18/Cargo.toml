[package]
name = "nmp-nip18"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-18 repost decoding and read-surfacing projections for NMP."

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false }
nmp-kinds = { path = "../nmp-kinds" }
nmp-planner = { path = "../nmp-planner", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
flatbuffers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
