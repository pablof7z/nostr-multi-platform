[package]
name = "nmp-wallet"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Wallet composition owner: backend capabilities, wallet projection shape, operation journal, backend seam, and PaymentPort backend selection."

[dependencies]
nmp-core = { path = "../nmp-core", version = "1.0.0-rc.1" }
nmp-nip47 = { path = "../nmp-nip47", version = "1.0.0-rc.1" }
# W2 (#2895): the Cashu `WalletBackend` adapter consumes nip60's mint HTTP
# lane (`cashu::client::MintClient`), wallet-config codec (`WalletConfig`),
# and kind constants — never its own relay socket (nip60 owns zero relay I/O;
# see nip60's own module docs).
nmp-nip60 = { path = "../nmp-nip60", version = "1.0.0-rc.1" }
# #2880 (NIP-87 mint discoverability): kind:38172 announcement + kind:38000
# recommendation codecs and NUT-capability parsing for the discovered-mints
# projection. Thin codec crate — no relay I/O, no wot, no wallet policy.
nmp-nip87 = { path = "../nmp-nip87", version = "1.0.0-rc.1" }
# #2880: web-of-trust scoring engine (`WotGraph`) reused — not reinvented — to
# weight/filter mint recommendations by the active account's follow graph.
nmp-wot = { path = "../nmp-wot", version = "1.0.0-rc.1" }
nmp-ownership = { workspace = true }
# #2917: `nostr::secp256k1::SecretKey` is the wire shape
# `nmp_nip60::nutzap::sign_p2pk_proof` takes for signing P2PK proofs on
# redeem — this crate never mints a Nostr identity keypair from it (D13
# still holds for the Nostr signer; this is the unrelated Cashu-domain key).
nostr = { workspace = true }
# W6 (#2908): `InterestShape` for the wallet's own read-interest shapes
# (`interests.rs`) — the kind-numbered filters this crate builds for its
# nutzap-receipt and self-authored NIP-60/NIP-61 observed projections.
nmp-planner = { path = "../nmp-planner", default-features = false, version = "1.0.0-rc.1" }
# The flat `UnsignedEvent`/`SignedEvent` shape the `Nip44EncryptForAccount` /
# `SignEventForAccount` ports carry — the same signer-transparent seam
# `nmp-nip17`'s gift-wrap chain uses (mirrored here for kind:17375/7375).
nmp-signer-iface = { path = "../nmp-signer-iface", version = "1.0.0-rc.1" }
# `RawEvent` for the pre-signed publish path (`PublishCommand::SignedEvent`).
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
# #2965: hex-encodes the Cashu P2PK pubkey `ingest::ingest_wallet_config`
# derives from a recovered kind:17375's privkey — same pin nip60 itself uses.
hex = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# #2920 (epic #2864): typed FlatBuffers `ActionPayload` codecs for the eight
# `nmp.wallet.*` action modules this crate owns (`wire.rs`) — the same
# ADR-0071 wire-encode dependency `nmp-nip25`/`nmp-nip47` carry for their own
# typed action payloads.
flatbuffers = { workspace = true }

[dev-dependencies]
# `test-support` enables `nmp_core::ActorMail`/`ProtocolCommandContextParts`
# capability adapters + noop singletons the Cashu backend's command tests
# drive directly (mirrors nmp-nip17/nmp-nip57's own dev-dependency).
# `native` pulls in the `__ffi_internal::ActionRegistry` seam the
# dispatch_integration test drives through `start_bytes`/`execute_bytes`
# (ADR-0071 / #1756, mirrors `nmp-nip47`'s own dev-dependency).
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
serde_json = { workspace = true }
