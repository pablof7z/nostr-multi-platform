[package]
name = "nmp-reposts"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Protocol-owned repost read plans and repost targets for NMP apps (NIP-18, #2758)."

[lib]
crate-type = ["rlib"]

[dependencies]
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "0.8.4" }
nmp-kinds = { path = "../nmp-kinds", version = "0.8.4" }
nmp-nip09 = { path = "../nmp-nip09", version = "0.8.4" }
nmp-nip18 = { path = "../nmp-nip18", version = "0.8.4" }
nmp-ownership = { workspace = true }
nmp-planner = { path = "../nmp-planner", version = "0.8.4" }
nmp-read-session = { path = "../nmp-read-session", version = "0.8.4" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
