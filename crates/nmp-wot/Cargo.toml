[package]
name = "nmp-wot"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Client-side web-of-trust primitives for NMP: follow/mute graph scoring plus automatic replaceable-kind bootstrap interests."

[dependencies]
nmp-core = { path = "../nmp-core", default-features = false }
nmp-network = { path = "../nmp-network", default-features = false }
# Direct dep on nmp-planner for InterestId / InterestLifecycle / InterestScope /
# LogicalInterest / stable_hash64 — the nmp_core::planner compat facade is
# deleted (#1608).
nmp-planner = { path = "../nmp-planner" }
# Typed FlatBuffers sidecar codec for the `nmp.wot.bootstrap` snapshot
# projection (ADR-0037). Workspace-pinned to 25.12.19, enforced by
# ci/check-flatbuffers-version-pins.sh.
flatbuffers = { workspace = true }
nostr = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-nip77 = { path = "../nmp-nip77" }
