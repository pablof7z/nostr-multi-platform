[package]
name = "nmp-nip25"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-25 public reaction actions and bounded viewer reaction projection for NMP apps."

[lib]
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-nip09 = { path = "../nmp-nip09", version = "1.0.0-rc.1" }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-signer-iface = { path = "../nmp-signer-iface", version = "1.0.0-rc.1" }
flatbuffers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# `native` enables `ActionRegistry` (via `__ffi_internal`) for registry-level
# trip tests (ADR-0071 / S3 #1751). `test-support` enables store harness helpers.
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
nmp-store = { path = "../nmp-store" }
