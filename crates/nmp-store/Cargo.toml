[package]
name = "nmp-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EventStore trait + MemEventStore / LmdbEventStore backends. Extracted from nmp-core (see docs/architecture/crate-boundaries.md §9)."

[lib]
name = "nmp_store"
path = "src/lib.rs"

[features]
# The `MemEventStore` is always compiled; `LmdbEventStore` is always compiled
# but only functional when this feature is on (it pulls in heed +
# nostr-database + the NMP-local nostr-lmdb fork). Off-by-default keeps wasm32
# builds (which never see LMDB) lean.
default = []
lmdb-backend = ["dep:nmp-nostr-lmdb", "dep:heed", "dep:nostr-database"]
# OPFS-SQLite EventStore backend (#1007). Off by default. The backing crate
# (`nmp-sqlite-wasm`) is wasm32-only and declared under the `[target.…wasm32…]`
# table below, so enabling this feature on a native target (e.g. via
# `--all-features`) resolves the `dep:` reference but compiles nothing — the
# dependency simply isn't part of the native dependency graph. Browser-only
# durable storage; native builds use Lmdb/Mem instead.
opfs-sqlite-backend = ["dep:nmp-sqlite-wasm"]
# Exposes a small surface used by integration tests and live-bench binaries
# (e.g. `VerifiedEvent::try_from_raw` is always public, but the `test-support`
# cfg gates the `RawEvent::sample_*` constructors and similar harness helpers).
test-support = []

[dependencies]
nmp-ownership = { workspace = true }
nmp-kinds = { path = "../nmp-kinds" }
nostr = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tracing = "0.1"
# #1811 — shared FTS tokenizer NFKC normalization. Already in the dependency
# graph transitively (nostr → idna); named directly so the tokenizer can
# `.nfkc()`. wasm-safe (pure Rust, no platform deps).
unicode-normalization = "0.1"
# D20 — wasm-safe time shim. `web-time 1.1.0` provides drop-in replacements
# for `std::time::{Instant, SystemTime, UNIX_EPOCH}` backed by
# `performance.now()` / `Date.now()` on wasm32-unknown-unknown. On native
# targets `web-time` re-exports `std::time` verbatim (zero-cost, zero-drift).
# `MemEventStore::gc_step` uses `Instant` only for its wall-clock budget check
# (`max_duration_ms`); that path is wasm-reachable (nmp-store → nmp-core →
# nmp-browser-runtime), so the bare `std::time::Instant::now()` call panicked at runtime.
web-time = "1.1"

# LMDB backend deps — feature-gated. The fork at crates/nmp-nostr-lmdb carries
# the env-injection seam (ADR-0011); heed / nostr-database are the underlying
# storage and event-encoding crates.
nmp-nostr-lmdb = { path = "../nmp-nostr-lmdb", optional = true }
heed = { version = "0.20", default-features = false, features = ["read-txn-no-tls"], optional = true }
nostr-database = { version = "0.44", default-features = false, features = ["flatbuf"], optional = true }

# OPFS-SQLite backend (#1007) — wasm32-only. Unlike LMDB's `heed` (which builds
# on every target and so sits in plain `[dependencies]`), the SQLite-on-OPFS
# engine only builds for the browser, so its crate lives here. Optional +
# enabled via the `opfs-sqlite-backend` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nmp-sqlite-wasm = { path = "../nmp-sqlite-wasm", optional = true }

[dev-dependencies]
tempfile = "3"
