[package]
name = "nmp-router"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "Layer-2 routing: one generic OutboxRouter algorithm (NIP-65 mailbox + relay hints + p-tag inbox + indexer eligibility), the NIP-65-only InMemoryMailboxCache, kind:10002 IngestParser, and indexer-republish policy. Step 2 of docs/architecture/crate-boundaries.md."

[dependencies]
# Substrate traits and value types — `OutboxRouter`, `MailboxCache`,
# `IngestParser`, `RoutingContext`, `RoutedRelaySet`, plus the
# `UnsignedEvent` / `ActionModule` types the absorbed
# `nmp.nip65.publish_relay_list` action module depends on.
# `default-features = false` so this Layer-2 crate compiles on wasm32: the
# routing algorithm uses only nmp-core's pure surface (store traits +
# MemEventStore, planner, publish, substrate, slots) — never the `native`-gated
# LMDB/tungstenite/mio I/O. Native consumers re-enable it through this crate's
# own `native` passthrough feature (default-on, so existing builds are
# unchanged); wasm consumers depend with `default-features = false`.
nmp-core = { path = "../nmp-core", default-features = false }
nmp-network = { path = "../nmp-network", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
# Direct dep on nmp-planner for InterestId / InterestLifecycle / InterestScope /
# InterestShape / LogicalInterest / HintSource — the nmp_core::planner compat
# facade is deleted (#1608). nmp-planner is a Layer-2 foundation crate; it is
# already in the dep graph through nmp-core.
nmp-planner = { path = "../nmp-planner", default-features = false }
# Direct dep on nmp-store for EventStore / VerifiedEvent / RawEvent / StoredEvent
# / MemEventStore / PubKey — the nmp_core::store compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store" }
# Layer-0 kind-constant registry — re-exports KIND_BLOCKED_RELAYS
# so this crate no longer duplicates that value (V-57).
nmp-kinds = { path = "../nmp-kinds" }
serde = { workspace = true, features = ["derive"] }
# Typed FlatBuffers action payloads (ADR-0064 / #1756) for the three relay-list
# action modules this crate owns (block/unblock relay + NIP-65 publish). Pinned
# to the workspace version verified by ci/check-flatbuffers-version-pins.sh.
flatbuffers = { workspace = true }
tracing = "0.1"

[features]
# Default-on so existing native consumers (nmp-defaults, app FFI crates) are
# byte-for-byte unchanged. Disable with `default-features = false` for wasm32.
default = ["native"]
native = ["nmp-core/native"]

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
serde_json.workspace = true
