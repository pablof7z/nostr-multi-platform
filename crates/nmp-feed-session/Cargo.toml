[package]
name = "nmp-feed-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared feed-session compiler for NMP runtimes."

[dependencies]
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-content = { path = "../nmp-content", version = "1.0.0-rc.1" }
nmp-feed = { path = "../nmp-feed", version = "1.0.0-rc.1" }
nmp-kinds = { path = "../nmp-kinds", version = "1.0.0-rc.1" }
nmp-nip02 = { path = "../nmp-nip02", version = "1.0.0-rc.1" }
nmp-nip09 = { path = "../nmp-nip09", version = "1.0.0-rc.1" }
nmp-nip18 = { path = "../nmp-nip18", version = "1.0.0-rc.1" }
nmp-nip29 = { path = "../nmp-nip29", version = "1.0.0-rc.1" }
nmp-nip51 = { path = "../nmp-nip51", version = "1.0.0-rc.1" }
nmp-ownership = { workspace = true }
nmp-planner = { path = "../nmp-planner", default-features = false, version = "1.0.0-rc.1" }
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
nmp-wot = { path = "../nmp-wot", version = "1.0.0-rc.1" }
trellis-core = "0.2.1"

[dev-dependencies]
# Driving-example proof (#3082): the composite-feed test exercises the REAL
# `nip22.root` mapping alongside the REAL `nip18.target` mapping (already a
# main dependency). Test-only — nmp-nip22 does not depend back on this crate.
nmp-nip22 = { path = "../nmp-nip22", version = "1.0.0-rc.1" }
