[package]
name = "nmp-browser-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser platform adapter for NMP: Worker event loop, browser relay transport, capability/signer provider registry, and the BrowserAppBuilder composition root. This crate (not nmp-wasm) owns the browser runtime."

[lib]
crate-type = ["cdylib", "rlib"]
# Native build: `cargo build -p nmp-browser-runtime`
# WASM32 build: `cargo build -p nmp-browser-runtime --target wasm32-unknown-unknown`
#   (requires wasm32 sysroot and secp256k1-sys wasm support; ci/test runs native only)

[dependencies]
# Kernel + composition surface. default-features=false keeps wasm32 free of mio/lmdb.
nmp-core = { path = "../nmp-core", default-features = false }
nmp-substrate-defaults = { path = "../nmp-substrate-defaults" }
nmp-store = { path = "../nmp-store" }
nmp-network = { path = "../nmp-network", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"
gloo-timers = "0.3"

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"], default-features = false }
wasm-bindgen-test = "0.3"
