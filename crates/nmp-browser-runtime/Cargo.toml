[package]
name = "nmp-browser-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser platform adapter for NMP: Worker event loop, browser relay transport, capability/signer provider registry, and the BrowserAppBuilder composition root. This crate (superseding the retired nmp-wasm) owns the browser runtime."

[lib]
crate-type = ["cdylib", "rlib"]
# Native build: `cargo build -p nmp-browser-runtime`
# WASM32 build: `cargo build -p nmp-browser-runtime --target wasm32-unknown-unknown`
#   (requires wasm32 sysroot and a C compiler with a wasm backend for secp256k1-sys)

[features]
default = []
# Mirrors `nmp-core`'s `native` feature so the browser pump's `ActorMail`
# match (`runtime/pump.rs`) can gate the `ActorMail::Relay` arm on the same
# condition that gates the variant's existence in `nmp-core` (#2765 / #2769
# item 10). Not enabled by default: the browser runtime's own dependency on
# `nmp-core` is `default-features = false`, so `ActorMail::Relay` does not
# exist in a plain `cargo build -p nmp-browser-runtime`.
native = ["nmp-core/native"]
# Enable the wasm-only NIP-07 async signing bridge inside `signer/completion.rs`.
# Must be paired with `--target wasm32-unknown-unknown` — enabling on a native
# target compiles the cfg guard out, not a build error. Propagates to
# `nmp-signers/wasm` so `nmp_signers::sign_event_via_extension` is available.
# Also pulls in the durable OPFS-SQLite store backend (#1007 PR-7): the
# production wasm build already turns `wasm` on, so this is where the browser
# gets persistence by default.
wasm = ["nmp-signers/wasm", "opfs-sqlite-backend"]
# Durable OPFS-SQLite `EventStore` backend (#1007 PR-7). Propagates
# `nmp-store/opfs-sqlite-backend`, which on wasm32 pulls the `nmp-sqlite-wasm`
# engine into the graph and exposes `nmp_store::OpfsSqliteEventStore`.
# On native this resolves to nothing: the engine lives under nmp-store's
# `[target.'cfg(wasm32)']` table and the `opfs` module self-gates on
# `target_arch = "wasm32"`, so native default builds are unaffected.
opfs-sqlite-backend = ["nmp-store/opfs-sqlite-backend"]
# Expose test-support seams (e.g. `set_active_account_for_test`) so integration
# tests in sibling crates can seed kernel state without a full identity flow.
test-support = []

[dependencies]
nmp-ownership = { workspace = true }
# Kernel + composition surface. default-features=false keeps wasm32 free of mio/lmdb.
nmp-core = { path = "../nmp-core", default-features = false }
# NIP-19 entity codec (Layer 4) carved out of nmp-core per issue #2515.
nmp-nostr-id = { path = "../nmp-nostr-id" }
nmp-content = { path = "../nmp-content" }
nmp-substrate = { path = "../nmp-substrate", default-features = false }
nmp-store = { path = "../nmp-store" }
nmp-network = { path = "../nmp-network", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
nmp-feed = { path = "../nmp-feed" }
nmp-feed-session = { path = "../nmp-feed-session" }
nmp-kinds = { path = "../nmp-kinds" }
nmp-note-feed = { path = "../nmp-note-feed" }
nmp-nip02 = { path = "../nmp-nip02" }
nmp-nip17 = { path = "../nmp-nip17" }
nmp-nip18 = { path = "../nmp-nip18" }
nmp-nip23 = { path = "../nmp-nip23" }
nmp-nip22 = { path = "../nmp-nip22" }
nmp-nip25 = { path = "../nmp-nip25" }
nmp-nip29 = { path = "../nmp-nip29" }
nmp-nip46 = { path = "../nmp-nip46" }
nmp-nip46-runtime = { path = "../nmp-nip46-runtime", default-features = false }
nmp-nip50 = { path = "../nmp-nip50" }
nmp-nip51 = { path = "../nmp-nip51" }
nmp-nip57 = { path = "../nmp-nip57", default-features = false }
nmp-nip84 = { path = "../nmp-nip84" }
nmp-planner = { path = "../nmp-planner", default-features = false }
nmp-replies = { path = "../nmp-replies" }
nmp-router = { path = "../nmp-router", default-features = false }
# Signer trait + LocalKeySigner / Nip07Signer implementations used by the
# capability-provider registry (#2049/#2066/#2067). `default-features = false`
# keeps the native build free of wasm-only signing bridges; the `wasm` feature
# above propagates `nmp-signers/wasm` for production wasm32 builds.
nmp-signers = { path = "../nmp-signers", default-features = false }
nmp-wot = { path = "../nmp-wot" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
flatbuffers = { workspace = true }
nostr = { workspace = true, features = ["std"] }
tracing = "0.1"
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"
gloo-timers = "0.3"
# Drive the async NIP-07 sign bridge (`signer/completion.rs` wasm path) and the
# async OPFS-SQLite store-open hook (`NmpWasmRuntime::prepare_store`, #1007 PR-7).
# Matches nmp-signers' version so feature unification keeps one copy in the graph.
wasm-bindgen-futures = "0.4.71"
# Honest-fallback log when the OPFS-SQLite open fails (#1007 PR-7). The repo's
# logging facade; wasm-safe. Scoped to the wasm path where prepare_store lives.
tracing = "0.1"
web-sys = { version = "0.3.98", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "WorkerGlobalScope",
] }

[dev-dependencies]
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", features = ["test-support"], default-features = false }
nmp-codegen = { path = "../nmp-codegen" }
wasm-bindgen-test = "0.3"
