[package]
name = "nmp-browser-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser platform adapter for NMP: Worker event loop, browser relay transport, capability/signer provider registry, and the BrowserAppBuilder composition root. This crate (not nmp-wasm) owns the browser runtime."

[lib]
crate-type = ["cdylib", "rlib"]
# Native build: `cargo build -p nmp-browser-runtime`
# WASM32 build: `cargo build -p nmp-browser-runtime --target wasm32-unknown-unknown`
#   (requires wasm32 sysroot and secp256k1-sys wasm support; ci/test runs native only)

[features]
default = []
# Enable the wasm-only NIP-07 async signing bridge inside `signer/completion.rs`.
# Must be paired with `--target wasm32-unknown-unknown` — enabling on a native
# target compiles the cfg guard out, not a build error. Propagates to
# `nmp-signers/wasm` so `nmp_signers::sign_event_via_extension` is available.
wasm = ["nmp-signers/wasm"]
# Expose test-support seams (e.g. `set_active_account_for_test`) so integration
# tests in sibling crates can seed kernel state without a full identity flow.
test-support = []

[dependencies]
# Kernel + composition surface. default-features=false keeps wasm32 free of mio/lmdb.
nmp-core = { path = "../nmp-core", default-features = false }
nmp-substrate-defaults = { path = "../nmp-substrate-defaults" }
nmp-store = { path = "../nmp-store" }
nmp-network = { path = "../nmp-network", default-features = false }
nmp-signer-iface = { path = "../nmp-signer-iface" }
# Signer trait + LocalKeySigner / Nip07Signer implementations used by the
# capability-provider registry (#2049/#2066/#2067). `default-features = false`
# keeps the native build free of wasm-only signing bridges; the `wasm` feature
# above propagates `nmp-signers/wasm` for production wasm32 builds.
nmp-signers = { path = "../nmp-signers", default-features = false }
# Neutral composition entry points: `register_defaults` / `register_substrate`.
# `default-features = false` keeps the wasm32 build free of native-only crates
# (nmp-ffi, nmp-feed, nmp-nip01, nmp-nip47, nmp-nip11).
nmp-defaults = { path = "../nmp-defaults", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"
gloo-timers = "0.3"
# Drive the async NIP-07 sign bridge (`signer/completion.rs` wasm path).
# Matches nmp-signers' version so feature unification keeps one copy in the graph.
wasm-bindgen-futures = "0.4.71"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# NIP-46 bunker-broker wiring for the native browser runtime (#2068).
# MUST remain in this native-only section: nmp-signer-broker depends on
# nmp-network/native (OS threads, sync I/O) and will NOT compile for wasm32.
# `cargo build -p nmp-browser-runtime --target wasm32-unknown-unknown` MUST
# NOT pull this crate into the dependency graph.
nmp-signer-broker = { path = "../nmp-signer-broker" }

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"], default-features = false }
wasm-bindgen-test = "0.3"
