[package]
name = "nmp-uniffi-support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable UniFFI facade contracts and bridge helpers for NMP native app objects."

[lib]
name = "nmp_uniffi_support"
crate-type = ["rlib"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "0.8.4" }
nmp-native-runtime = { path = "../nmp-native-runtime", version = "0.8.4" }
serde_json = { workspace = true }
