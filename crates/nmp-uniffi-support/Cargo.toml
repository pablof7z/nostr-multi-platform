[package]
name = "nmp-uniffi-support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable UniFFI facade contracts and bridge helpers for NMP native app objects."

[lib]
name = "nmp_uniffi_support"
crate-type = ["rlib"]

[features]
# #3086 — expose `open_composite_feed` binding-support mechanics. Opt-in, like
# every other concept-owned native-runtime edge (#2797): a facade that never
# declares a composite feed does not pull nmp-nip18/nmp-nip22 in through this
# crate either.
composite-feed = ["nmp-native-runtime/composite-feed"]

[dependencies]
nmp-ownership = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-native-runtime = { path = "../nmp-native-runtime", version = "1.0.0-rc.1" }
nmp-read-session = { path = "../nmp-read-session", version = "1.0.0-rc.1" }
serde_json = { workspace = true }
