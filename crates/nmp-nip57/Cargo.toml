[package]
name = "nmp-nip57"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-57 lightning zaps as an NMP protocol crate — ZapReceiptRecord decoder (kind:9735) + ZapRequestBuilder (kind:9734) + ZapAction ActionModule + ZapsView + LNURL-pay fetcher (FetchLnurlInvoiceCommand)."

[features]
# `native` gates the LNURL-pay HTTP worker (`FetchLnurlInvoiceCommand` +
# `sign_zap_request`) which uses `ureq` + `std::thread::spawn` — not
# available on wasm32. Enabled by default so existing native consumers see
# no change. Disable with `default-features = false` for wasm32 / pure-Rust
# compilation (the zap decoder, builder, view, and FlatBuffers codec remain
# always-compiled).
default = ["native"]
native = ["nmp-wellknown-http/native"]

[dependencies]
nmp-ownership = { workspace = true }
# Pure-kernel traits only (no I/O layer needed for decode/view/FlatBuffers).
# `native` feature on nmp-core is opted-in by callers that need it via
# feature unification — no explicit re-export required here.
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-signer-iface = { path = "../nmp-signer-iface", version = "1.0.0-rc.1" }
# Direct dep on nmp-planner for InterestId / InterestShape / LogicalInterest /
# stable_hash64 — the nmp_core::planner compat facade is deleted (#1608).
nmp-planner = { path = "../nmp-planner", default-features = false, version = "1.0.0-rc.1" }
# Direct dep on nmp-store for StoredEvent / RawEvent — the nmp_core::store
# compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
# Layer-0 kind-constant registry — re-exports KIND_ZAP_REQUEST / KIND_ZAP_RECEIPT
# so this crate no longer duplicates those values (V-57).
nmp-kinds = { path = "../nmp-kinds", version = "1.0.0-rc.1" }
flatbuffers = { workspace = true }
# #1728: zap-pay chain — after fetching the bolt11, `FetchLnurlInvoiceCommand`
# emits a payment through the injected `nmp_core::substrate::PaymentPort`
# (NIP-47 supplies the concrete adapter at composition time). NIP-57 no longer
# depends on `nmp-nip47`; the dependency edge inverted to `nmp-nip47 → nmp-core`.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# LNURL-pay fetcher dependencies (V-41). The fetcher runs on
# `std::thread::spawn` from the actor's `Protocol(...)` dispatch arm and does a
# two-leg HTTP round-trip through the shared `nmp-wellknown-http` bounded GET
# (#2927 — the forked `http_get_json` copy that used to live here was deleted).
# `bech32` decodes LUD-01 `lnurl1…` inputs; `nostr` mints the kind:9734
# signature on the actor thread (keys come from
# `ProtocolCommandContext::active_local_keys`).
nmp-wellknown-http = { path = "../nmp-wellknown-http", version = "1.0.0-rc.1" }
bech32 = "0.11"
nostr = { workspace = true }
# NIP-57 description-hash validation: the bolt11 `h` field must equal
# SHA-256(zap-request JSON) before the wallet auto-pays. Uses the audited
# `sha2` implementation (same version the rest of the workspace pins) — never
# hand-rolled crypto. Always-compiled: the check is pure and wasm-safe.
sha2 = "0.10"
# Diagnostic logger for the LNURL worker (matches the rest of nmp-core's
# tracing usage). Always available — `tracing` is in the lockfile via
# nostr already, so this adds nothing new.
tracing = "0.1"

[dev-dependencies]
# `native` enables `ActionRegistry` (via `__ffi_internal`) for registry-level
# trip tests (ADR-0071 / S9 #1747). `test-support` enables store harness helpers.
nmp-core = { path = "../nmp-core", features = ["test-support", "native"] }
