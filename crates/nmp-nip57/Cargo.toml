[package]
name = "nmp-nip57"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-57 lightning zaps as an NMP protocol crate — ZapReceiptRecord decoder (kind:9735) + ZapRequestBuilder (kind:9734) + ZapAction ActionModule + ZapsView + LNURL-pay fetcher (FetchLnurlInvoiceCommand)."

[features]
# `native` gates the LNURL-pay HTTP worker (`FetchLnurlInvoiceCommand` +
# `sign_zap_request`) which uses `ureq` + `std::thread::spawn` — not
# available on wasm32. Enabled by default so existing native consumers see
# no change. Disable with `default-features = false` for wasm32 / pure-Rust
# compilation (the zap decoder, builder, view, and FlatBuffers codec remain
# always-compiled).
default = ["native"]
native = ["dep:ureq"]

[dependencies]
# Pure-kernel traits only (no I/O layer needed for decode/view/FlatBuffers).
# `native` feature on nmp-core is opted-in by callers that need it via
# feature unification — no explicit re-export required here.
nmp-core = { path = "../nmp-core", default-features = false }
# Layer-0 kind-constant registry — re-exports KIND_ZAP_REQUEST / KIND_ZAP_RECEIPT
# so this crate no longer duplicates those values (V-57).
nmp-kinds = { path = "../nmp-kinds" }
# Typed FlatBuffers codec for the `nmp.nip57.zaps` snapshot sidecar (ADR-0037).
flatbuffers = { workspace = true }
# V-43: zap-pay chain — after fetching the bolt11, `FetchLnurlInvoiceCommand`
# auto-dispatches `WalletPayInvoiceCommand` using the process-global
# `active_wallet_runtime()`. The correlation_id threads through so the
# `nmp.nip57.zap` action closes on kind:23195 confirmation, not on bolt11 fetch.
nmp-nip47 = { path = "../nmp-nip47" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LNURL-pay fetcher dependencies (V-41). The fetcher runs on
# `std::thread::spawn` from the actor's `Protocol(...)` dispatch arm and
# uses `ureq` for the two-leg HTTP round-trip. `bech32` decodes LUD-01
# `lnurl1…` inputs; `nostr` mints the kind:9734 signature on the actor
# thread (the keys come from `ProtocolCommandContext::active_local_keys`).
# Optional — gated by the `native` feature; absent on wasm32.
ureq = { version = "2", optional = true, default-features = false, features = ["tls", "json"] }
bech32 = "0.11"
nostr = { workspace = true }
# Diagnostic logger for the LNURL worker (matches the rest of nmp-core's
# tracing usage). Always available — `tracing` is in the lockfile via
# nostr already, so this adds nothing new.
tracing = "0.1"

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
nmp-ffi = { path = "../nmp-ffi", features = ["test-support"] }
