[package]
name = "nmp-nip01"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-01 short text notes (kind:1) relation surface as an NMP protocol crate — NoteRecord decoder (+ NIP-10 refs), NoteBuilder, RepliesView + ThreadView per docs/design/kind-wrappers.md §3 and view-catalog §5. Relation read-views + note builder only; kernel timeline extraction is a separate effort."

[dependencies]
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false }
# Direct dep on nmp-planner for stable_hash64 / InterestShape — the
# nmp_core::stable_hash/planner compat facades are deleted (#1608).
nmp-planner = { path = "../nmp-planner", default-features = false }
# Direct dep on nmp-store for VerifiedEvent / RawEvent / StoredEvent —
# the nmp_core::store compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store" }
nmp-content = { path = "../nmp-content" }
nmp-feed = { path = "../nmp-feed" }
nmp-nip18 = { path = "../nmp-nip18" }
nmp-nip57 = { path = "../nmp-nip57", default-features = false }
nmp-threading = { path = "../nmp-threading" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = "0.1"

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
