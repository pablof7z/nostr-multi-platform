[package]
name = "nmp-nip01"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-01 short text notes (kind:1) relation surface as an NMP protocol crate — NoteRecord decoder (+ NIP-10 refs), NoteBuilder, RepliesView + ThreadView per docs/design/kind-wrappers.md §3 and view-catalog §5. Relation read-views + note builder only; kernel timeline extraction is a separate effort."

[dependencies]
nmp-ownership = { workspace = true }
flatbuffers = { workspace = true }
nmp-core = { path = "../nmp-core", default-features = false, version = "1.0.0-rc.1" }
nmp-signer-iface = { path = "../nmp-signer-iface", version = "1.0.0-rc.1" }
# Direct dep on nmp-store for VerifiedEvent / RawEvent / StoredEvent —
# the nmp_core::store compat facade is deleted (#1608).
nmp-store = { path = "../nmp-store", version = "1.0.0-rc.1" }
nmp-threading = { path = "../nmp-threading", version = "1.0.0-rc.1" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = "0.1"

[dev-dependencies]
nmp-core = { path = "../nmp-core", features = ["test-support"] }
