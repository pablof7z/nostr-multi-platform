[package]
name = "nmp-nwc"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-47 Nostr Wallet Connect client — URI parsing, NIP-44 encrypted request/response, kind:23194 builder, kind:23195 decoder."

[dependencies]
nmp-ownership = { workspace = true }
# `nip04`/`nip44`: NWC request/response encryption (see `crypto.rs`).
# `nip47` is deliberately NOT enabled — `nostr`'s `NostrWalletConnectURI` is a
# strict `url::Url`-based spec parser that rejects the real-world URI shapes this
# client must accept (case-insensitive scheme, hand-copy whitespace) and exposes
# wallet-spending key material un-zeroized. See `parse.rs` for the full rationale.
nostr = { version = "0.44", features = ["std", "nip04", "nip44"] }
# RFC 4648 base64 — used to decode and length-check NIP-04 IV bytes before
# delegating to `nip04::decrypt`. Same version as nmp-blossom; must not
# be reimplemented inline (docs/aim.md § "use rust-nostr, not scratch crypto").
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
