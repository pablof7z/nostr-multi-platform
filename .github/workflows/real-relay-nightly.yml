name: real-relay matrix

# Scheduled/manual only. Hermetic fixture tests stay in the PR workflows; this
# workflow is the explicit public-relay signal for live relay capabilities.

on:
  schedule:
    # 03:00 UTC daily, before the iOS UI nightly.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-relay:
    name: ${{ matrix.capability }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      # Several scenarios use global process hooks or public relay side effects.
      # Run rows serially by design; each cargo test command also uses one
      # libtest thread.
      max-parallel: 1
      matrix:
        include:
          - scenario: connect-subscribe
            capability: connect/subscribe
            timeout: 15
            relays: wss://relay.damus.io wss://nos.lol wss://relay.primal.net
            command: >-
              cargo test -p nmp-testing --test real_relay_connect
              -- --ignored --nocapture --test-threads=1

          - scenario: publish-ok
            capability: publish OK
            timeout: 15
            relays: wss://relay.damus.io
            command: >-
              cargo test -p nmp-testing --test real_relay_smoke damus_round_trip_kind1
              -- --ignored --nocapture --test-threads=1

          - scenario: nip65-outbox
            capability: NIP-65 outbox routing
            timeout: 15
            relays: wss://relay.damus.io wss://relay.primal.net wss://purplepag.es wss://nos.lol
            command: >-
              cargo test -p nmp-testing --test real_relay_outbox
              -- --ignored --nocapture --test-threads=1

          - scenario: nip42-auth
            capability: NIP-42 auth
            timeout: 20
            relays: wss://nostr.wine wss://relay.snort.social wss://auth.nostr1.com wss://nostr.land wss://relay.damus.io
            command: >-
              cargo test -p nmp-testing --test real_relay_nip42
              -- --ignored --nocapture --test-threads=1

          - scenario: nip17-cold-start
            capability: NIP-17 cold start
            timeout: 20
            relays: wss://relay.primal.net
            command: >-
              cargo test -p nmp-testing --test real_relay_nip17_cold_start_kernel
              nip17_cold_start_receive_through_real_kernel
              -- --ignored --nocapture --test-threads=1

          - scenario: marmot-roundtrip
            capability: Marmot roundtrip
            timeout: 20
            relays: wss://relay.damus.io
            command: >-
              cargo test -p nmp-testing --test real_relay_marmot_roundtrip
              marmot_kind445_roundtrip_over_damus
              -- --ignored --nocapture --test-threads=1

          - scenario: feed-matrix
            capability: declared feed matrix
            timeout: 20
            relays: wss://relay.damus.io wss://nos.lol wss://relay.primal.net wss://purplepag.es
            command: >-
              cargo test -p nmp-testing --test real_relay_feed_matrix
              -- --ignored --nocapture --test-threads=1

          - scenario: subscription-replan
            capability: follow-list replan
            timeout: 15
            relays: wss://relay.damus.io wss://relay.primal.net wss://purplepag.es
            command: >-
              cargo test -p nmp-testing --test real_relay_replan
              -- --ignored --nocapture --test-threads=1

          - scenario: reduced-source-feed
            capability: ReducedSource feed acquisition
            timeout: 20
            relays: wss://relay.damus.io wss://relay.primal.net wss://nos.lol
            command: >-
              cargo test -p nmp-testing --test real_relay_reduced_source
              -- --ignored --nocapture --test-threads=1

          - scenario: nip50-search
            capability: NIP-50 search relay
            timeout: 20
            relays: wss://nostr.wine wss://nos.lol
            command: >-
              cargo test -p nmp-testing --features real-relay
              --test real_relay_nip50_search
              -- --ignored --nocapture --test-threads=1

          - scenario: relay-search-a1-cold-claim
            capability: relay-search radius A1
            timeout: 20
            relays: wss://relay.primal.net wss://purplepag.es
            command: >-
              cargo test -p nmp-testing --features real-relay
              --test relay_search_radius_a1_cold_claim
              -- --ignored --nocapture --test-threads=1

          - scenario: relay-search-a2-warm-path
            capability: relay-search radius A2
            timeout: 20
            relays: wss://relay.primal.net wss://purplepag.es
            command: >-
              cargo test -p nmp-testing --features real-relay
              --test relay_search_radius_a2_warm_path
              -- --ignored --nocapture --test-threads=1

          - scenario: relay-search-a3-lmdb-restart
            capability: relay-search radius A3 LMDB
            timeout: 25
            relays: wss://relay.primal.net wss://purplepag.es
            command: >-
              cargo test -p nmp-testing --features real-relay,lmdb-backend
              --test relay_search_radius_a3_restart_persistence
              -- --ignored --nocapture --test-threads=1

          - scenario: relay-search-a5-unreachable
            capability: relay-search radius A5
            timeout: 20
            relays: wss://relay.primal.net
            command: >-
              cargo test -p nmp-testing --features real-relay
              --test relay_search_radius_a5_mid_claim_unreachable
              -- --ignored --nocapture --test-threads=1

          - scenario: relay-search-a6-concurrent
            capability: relay-search radius A6
            timeout: 20
            relays: wss://relay.primal.net wss://purplepag.es
            command: >-
              cargo test -p nmp-testing --features real-relay
              --test relay_search_radius_a6_concurrent_claims
              -- --ignored --nocapture --test-threads=1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-real-relay-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-real-relay-

      - name: Run real-relay scenario
        id: scenario
        env:
          CAPABILITY: ${{ matrix.capability }}
          COMMAND: ${{ matrix.command }}
          OUTPUT_DIR: real-relay-output
          RELAYS: ${{ matrix.relays }}
          RUST_BACKTRACE: 1
          RUST_MIN_STACK: 8388608
          SCENARIO: ${{ matrix.scenario }}
        run: .github/scripts/real-relay-scenario.sh

      - name: Upload scenario output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-relay-${{ matrix.scenario }}-${{ github.run_id }}
          path: real-relay-output/
          retention-days: 7
