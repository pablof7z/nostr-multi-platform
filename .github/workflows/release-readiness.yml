name: release-readiness

on:
  push:
    tags:
      - "nmp-v*"
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "release/**"
      - "ci/check-release-manifest.sh"
      - "ci/check-release-migration-note.sh"
      - "ci/check-excluded-crate-standalone-builds.sh"
      - "ci/release-package-dry-run.sh"
      - ".github/workflows/release-readiness.yml"
      - "docs/migration-notes/**"
      - ".github/workflows/browser-runtime-conformance.yml"
      - "crates/nmp-browser-runtime-conformance/**"
      - "apps/**/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "web/package*.json"
      - "web/packages/**"
      - "ci/check-web-package-consumer-smoke.sh"
  workflow_dispatch:

jobs:
  # Every public NMP release tag must prove the full browser-runtime OPFS path.
  browser-runtime-conformance:
    name: browser runtime OPFS conformance
    if: startsWith(github.ref, 'refs/tags/nmp-v')
    uses: ./.github/workflows/browser-runtime-conformance.yml

  release-readiness:
    name: release manifest + package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-readiness-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-readiness-

      - name: Install wasm-pack
        run: if ! command -v wasm-pack >/dev/null 2>&1; then cargo install wasm-pack --locked; fi

      - name: Install wasm C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Check release manifest
        run: bash ci/check-release-manifest.sh

      - name: Check release migration note
        run: bash ci/check-release-migration-note.sh

      - name: Check workspace-excluded crates build standalone
        run: bash ci/check-excluded-crate-standalone-builds.sh

      - name: Package dry-run for public artifacts
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: bash ci/release-package-dry-run.sh

      - name: Public web package consumer smoke
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: bash ci/check-web-package-consumer-smoke.sh
