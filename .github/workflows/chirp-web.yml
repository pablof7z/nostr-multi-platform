name: chirp-web

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/chirp-web.yml"
      - "crates/nmp-wasm/**"
      - "web/chirp/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/chirp-web.yml"
      - "crates/nmp-wasm/**"
      - "web/chirp/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  chirp-web:
    name: wasm facade and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Test wasm facade
        run: cargo test -p nmp-wasm

      # secp256k1-sys's build.rs invokes `cc` to compile C code for wasm32.
      # On Ubuntu the default `cc` is GCC, which has no wasm32 backend; pinning
      # `CC_wasm32_unknown_unknown=clang` makes cc-rs use the system clang
      # (clang-14+ on ubuntu-latest, which ships with wasm32 support). On Linux
      # the GNU `ar` understands wasm object files so we let cc-rs default to
      # it (homebrew LLVM ships `llvm-ar`, ubuntu-latest does not).
      - name: Check wasm target
        env:
          CC_wasm32_unknown_unknown: clang
        run: cargo check -p nmp-wasm --target wasm32-unknown-unknown

      # W1 — the first test that actually EXECUTES wasm in a browser.
      # `wasm-pack test --headless --chrome` compiles nmp-wasm to wasm32,
      # spins up headless Chrome via chromedriver (both ship on ubuntu-latest),
      # and runs the `#[wasm_bindgen_test]` suite. This is the milestone proof:
      # the runtime boots without panicking on wasm32-unknown-unknown.
      #
      # wasm-bindgen-cli must match the `wasm-bindgen = "0.2.x"` pin in
      # nmp-wasm/Cargo.toml. wasm-pack resolves and caches a compatible version
      # automatically (look for "Caching wasm-bindgen..." in the step log).
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Boot test in headless Chrome
        env:
          CC_wasm32_unknown_unknown: clang
        run: wasm-pack test --headless --chrome crates/nmp-wasm

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/chirp/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web/chirp

      - name: Build Chirp web
        run: npm run build
        working-directory: web/chirp

      - name: Test Chirp web runtime
        run: npm run test
        working-directory: web/chirp

      - name: Audit web dependencies
        run: npm audit --audit-level=moderate
        working-directory: web/chirp
