name: chirp-web

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/chirp-web.yml"
      - "apps/chirp/nmp-app-chirp-web/**"
      - "crates/nmp-content/schema/**"
      - "crates/nmp-content/src/embed_projection/**"
      - "crates/nmp-content/src/wire/**"
      - "crates/nmp-core/schema/**"
      - "crates/nmp-core/src/actor/typed_projections/**"
      - "crates/nmp-core/src/kernel/relay_diagnostics.rs"
      - "crates/nmp-core/src/kernel/relay_diagnostics/**"
      - "crates/nmp-core/src/kernel/typed_projections/**"
      - "crates/nmp-feed/schema/**"
      - "crates/nmp-feed/src/typed_wire/**"
      - "crates/nmp-nip01/schema/**"
      - "crates/nmp-nip01/src/op_feed/**"
      - "crates/nmp-nip01/src/typed_wire.rs"
      - "crates/nmp-nip01/src/typed_wire/**"
      - "crates/nmp-wasm/**"
      # The wasm facade compiles nmp-core with `default-features = false` and
      # nmp-network for wasm32. A wasm-reachability regression in either crate
      # (e.g. #1552's native-only import in an always-compiled module) only
      # surfaces here, so changes to them MUST run this job.
      - "crates/nmp-core/**"
      - "crates/nmp-network/**"
      - "web/chirp/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/chirp-web.yml"
      - "apps/chirp/nmp-app-chirp-web/**"
      - "crates/nmp-content/schema/**"
      - "crates/nmp-content/src/embed_projection/**"
      - "crates/nmp-content/src/wire/**"
      - "crates/nmp-core/schema/**"
      - "crates/nmp-core/src/actor/typed_projections/**"
      - "crates/nmp-core/src/kernel/relay_diagnostics.rs"
      - "crates/nmp-core/src/kernel/relay_diagnostics/**"
      - "crates/nmp-core/src/kernel/typed_projections/**"
      - "crates/nmp-feed/schema/**"
      - "crates/nmp-feed/src/typed_wire/**"
      - "crates/nmp-nip01/schema/**"
      - "crates/nmp-nip01/src/op_feed/**"
      - "crates/nmp-nip01/src/typed_wire.rs"
      - "crates/nmp-nip01/src/typed_wire/**"
      - "crates/nmp-wasm/**"
      - "crates/nmp-core/**"
      - "crates/nmp-network/**"
      - "web/chirp/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  chirp-web:
    name: wasm facade and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Test wasm facade
        run: cargo test -p nmp-wasm

      # secp256k1-sys's build.rs invokes `cc` to compile C code for wasm32.
      # On Ubuntu the default `cc` is GCC, which has no wasm32 backend; pinning
      # `CC_wasm32_unknown_unknown=clang` makes cc-rs use the system clang
      # (clang-14+ on ubuntu-latest, which ships with wasm32 support). On Linux
      # the GNU `ar` understands wasm object files so we let cc-rs default to
      # it (homebrew LLVM ships `llvm-ar`, ubuntu-latest does not).
      - name: Check wasm target
        env:
          CC_wasm32_unknown_unknown: clang
        run: cargo check -p nmp-wasm --target wasm32-unknown-unknown

      - name: Check nmp-app-chirp-web wasm32 target
        env:
          CC_wasm32_unknown_unknown: clang
        run: cargo check -p nmp-app-chirp-web --target wasm32-unknown-unknown

      - name: Test nmp-app-chirp-web native
        run: cargo test -p nmp-app-chirp-web

      # W1 — the first test that actually EXECUTES wasm in a browser.
      # `wasm-pack test --headless --chrome` compiles nmp-wasm to wasm32,
      # spins up headless Chrome via chromedriver (both ship on ubuntu-latest),
      # and runs the `#[wasm_bindgen_test]` suite. This is the milestone proof:
      # the runtime boots without panicking on wasm32-unknown-unknown.
      #
      # wasm-bindgen-cli must match the `wasm-bindgen = "0.2.x"` pin in
      # nmp-wasm/Cargo.toml. wasm-pack resolves and caches a compatible version
      # automatically (look for "Caching wasm-bindgen..." in the step log).
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Boot test in headless Chrome
        env:
          CC_wasm32_unknown_unknown: clang
        run: wasm-pack test --headless --chrome crates/nmp-wasm

      # W2 — build the production wasm package that web/chirp consumes.
      # The artifact is intentionally NOT checked in (public/nmp-wasm/ is
      # gitignored); this step is the only authoritative build path in CI.
      # wasm-pack is already installed by the step above; no re-install needed.
      - name: Build wasm package for web/chirp
        env:
          CC_wasm32_unknown_unknown: clang
        run: wasm-pack build --target web apps/chirp/nmp-app-chirp-web --out-dir ../../../web/chirp/public/nmp-wasm

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web/chirp

      - name: Build Chirp web
        run: npm run build
        working-directory: web/chirp

      - name: Test Chirp web runtime
        run: npm run test
        working-directory: web/chirp

      # W3 — Playwright boot smoke: proves the real NMP wasm runtime boots
      # in a real (headless) Chromium browser against a fixture relay.
      # Three honest assertions:
      #   (1) nmp-has-snapshot span appears — wasm emitted update_bytes binary
      #       frames (DegradedRuntime.handle() never emits update_bytes).
      #   (2) nmp-bridge-kind is not "in-process fallback" — Worker path active.
      #   (3) fixture relay received ≥1 WS connection from the browser.
      # NOTE: relay-row-from-snapshot (decoded Connected status) is deferred to
      # issue #1209 — TypeScript FlatBuffers bindings pre-date PR-B and expose
      # only the deprecated zeroed payload field, not typed_projections.
      # `npx playwright install --with-deps chromium` downloads the Playwright-
      # bundled Chromium binary plus its OS dependencies into the runner's
      # home directory (cached separately from the node_modules cache above).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web/chirp

      - name: Boot smoke (Playwright)
        run: npx playwright test
        working-directory: web/chirp

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/chirp/playwright-report/
          retention-days: 7

      - name: Audit web dependencies
        run: npm audit --audit-level=moderate
        working-directory: web/chirp
