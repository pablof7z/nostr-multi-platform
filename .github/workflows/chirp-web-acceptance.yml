name: chirp-web-acceptance

# Real-relay acceptance suite for the Chirp Web rebuild (#2038 item E).
#
# Two tiers, deliberately split by cost:
#
#   pr-smoke  (BLOCKING, every web PR/push)
#     Typechecks the app + the e2e suite and runs the wasm-FREE browser
#     acceptance (Playwright, `--grep-invert @wasm`): the shell's degraded /
#     in-process fallback boot path, which proves the shell mounts and renders
#     the data-* hooks WITHOUT needing the wasm artifact. Cheap (Node only), so
#     it gates every PR and the specs can never silently rot.
#
#   full-e2e-wasm  (NIGHTLY + manual dispatch, NON-BLOCKING by construction)
#     Builds the real wasm artifact (crates/nmp-browser-runtime/scripts/
#     build-wasm.sh via `npm run build:wasm`), builds the Chirp app, and runs
#     the FULL Playwright suite headless — including the `@wasm` tests (real
#     boot, fixture-relay connect + ingest, publish round-trip).
#
#     Why this is NOT a PR-blocking gate (honest constraint, do-not-silently-skip):
#       browser-runtime.yml blocks PRs on the full runtime's wasm32 compile
#       graph. This job goes further: it builds the release wasm artifact,
#       builds the Chirp app, installs Playwright, and runs the full browser
#       e2e suite. That cost belongs on a nightly schedule (plus
#       workflow_dispatch for on-demand verification of a web/chirp PR) rather
#       than blocking every PR. The coverage is NOT skipped — it runs nightly
#       and can be triggered manually on any branch.

on:
  # Blocking smoke runs on web changes.
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/chirp-web-acceptance.yml"
      - "web/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/chirp-web-acceptance.yml"
      - "web/**"
  # Full wasm browser e2e runs nightly + on demand.
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC, after the real-relay matrix (03:00).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ── BLOCKING: typecheck + wasm-free browser acceptance ────────────────────
  pr-smoke:
    name: chirp-web typecheck + fallback smoke (no wasm)
    # Skip on schedule (the nightly only needs the full wasm job).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # The committed lockfile is generated on macOS; per npm's platform-specific
      # optional-dependency locking it records only the darwin rolldown binding
      # node entry. On the linux runner `npm ci` therefore installs no rolldown
      # native binary and `vite build` (vite 8 / rolldown) fails with "Cannot
      # find module @rolldown/binding-linux-x64-gnu". Install the linux-x64 binary
      # explicitly at the exact version rolldown pins, WITHOUT mutating the shared
      # lockfile (--no-save --no-package-lock). ubuntu-latest is x64 + glibc, so
      # linux-x64-gnu is the correct variant. Regenerating a multi-platform lock
      # was rejected: it churns the shared web/ lockfile (gallery/registry/Items
      # C+D) with unrelated version bumps.
      - name: Install linux rolldown native binary (lockfile is darwin-only)
        working-directory: web
        run: |
          VER="$(node -p "require('./node_modules/rolldown/package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu']")"
          npm install --no-save --no-package-lock "@rolldown/binding-linux-x64-gnu@${VER}"

      - name: Typecheck app (src)
        run: npm run typecheck
        working-directory: web/chirp

      - name: Typecheck acceptance suite (tests/)
        run: npm run typecheck:e2e
        working-directory: web/chirp

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web/chirp

      - name: Build Chirp app (wasm artifact not required for the build step)
        run: npm run build
        working-directory: web/chirp

      - name: Run wasm-free browser acceptance (fallback boot smoke)
        run: npm run test:e2e -- --grep-invert @wasm
        working-directory: web/chirp

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chirp-web-pr-smoke-report
          path: web/chirp/playwright-report/
          retention-days: 7

  # ── NIGHTLY / DISPATCH: full wasm browser e2e (non-blocking) ──────────────
  full-e2e-wasm:
    name: chirp-web full wasm e2e (nightly / dispatch)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: chirp-web-acceptance-wasm

      # secp256k1-sys needs a C compiler that can target wasm32. clang ships a
      # wasm backend, lld provides wasm-ld, and llvm provides llvm-ar.
      - name: Install wasm C toolchain (clang + lld + llvm-ar)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # Same darwin-only-lockfile fix as the pr-smoke job (see comment there):
      # install the linux rolldown native binary that `vite build` needs.
      - name: Install linux rolldown native binary (lockfile is darwin-only)
        working-directory: web
        run: |
          VER="$(node -p "require('./node_modules/rolldown/package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu']")"
          npm install --no-save --no-package-lock "@rolldown/binding-linux-x64-gnu@${VER}"

      - name: Build wasm artifact (nmp-browser-runtime → public/nmp-wasm)
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: npm run build:wasm
        working-directory: web/chirp

      - name: Show wasm artifact contents
        run: ls -la web/chirp/public/nmp-wasm || echo "wasm artifact missing"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web/chirp

      - name: Build Chirp app
        run: npm run build
        working-directory: web/chirp

      - name: Run full acceptance suite (includes @wasm)
        run: npm run test:e2e
        working-directory: web/chirp

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chirp-web-full-e2e-report
          path: web/chirp/playwright-report/
          retention-days: 14
