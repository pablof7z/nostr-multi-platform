name: s3-snapshot-pressure-gate

# M10.5 §G-S3 snapshot-pressure regression gate + ADR-0055 R6-S4 feed-idle gate.
#
# §G-S3 enforces the C-ABI serialization path that Swift actually calls:
# `nmp_app_set_update_callback` + snapshot emit under a 100k-event corpus.
# Gate thresholds (docs/design/ffi-hardening/gates.md §G-S3):
#   callback_p99_ms     <= 20 ms   (per-emit serialization wall-time p99)
#   max_payload_bytes   <= 2 MiB   (per-emit payload size)
#   apply_us_p99        <= 16,000  (callback apply_us p99 ≈ one 60 Hz frame)
#   emit_hz             <= 60 Hz   (D8 reconciler frequency bound)
#   rev_monotonic       == 1       (rev strictly increasing, bible #1)
#   net_heap_per_emit   <= 2×payload_bytes (D8/G-S3 row 5 heap budget)
#
# ADR-0055 R6-S4 feed-idle gate (S7) — added as a sibling step so a future
# change that breaks feed-omission (the byte-equality gate that drops the
# ~41 KB idle feed payload) fails CI. Four hard gates (s7_feed_gates.rs):
#   idle_feed_bytes_omitted                  (>= 1 idle tick omits the feed)
#   p50_frame_bytes_incremental_lt_baseline  (idle p50 ON < OFF)
#   byte_identity_oracle                     (fail-closed lossless reconstruction)
#   out_of_window_false_resend_rate          (over-invalidation proof == 0)
# Cheap (~15 s wall-clock) and reuses the same release binary built above, so
# it adds negligible time to the nightly job.
#
# Why nightly + workflow_dispatch (not push/PR): injection of 100k real
# Schnorr-signed events plus release build costs ~8–12 min on ubuntu-latest.
# Running on every PR is disproportionate for a slow-moving ABI invariant.
# Manual dispatch is wired so reviewers can opt-in for risky changes touching:
#   nmp-core/src/kernel/, crates/nmp-core/src/actor/,
#   crates/nmp-core/src/snapshot.rs, ffi/mod.rs, ffi/bridge.rs,
#   crates/nmp-nip01/src/op_feed/, crates/nmp-defaults/src/op_feed_defaults.rs.
# The harness exits 2 on gate failure (--fail-on-gate); the job fails on any
# non-zero exit.
#
# First execution: happens on the next nightly run after this workflow merges;
# the release binary is NOT pre-built — the build step produces it each time.
# The s3 scenario has no --duration knob (it is event-count-driven, not
# wall-clock-driven; see s3_snapshot_pressure.rs S3Config). The feed-idle
# scenario is driven by explicit idle ticks (see s7_feed_idle.rs).

on:
  schedule:
    # 08:00 UTC daily — one hour after s2-retention-gate (07:00 UTC), so
    # both gates do not compete for the same runner slot.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  s3-snapshot-pressure:
    name: §G-S3 snapshot-pressure gate (release, --fail-on-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-
            ${{ runner.os }}-cargo-

      - name: Build ffi-stress (release)
        run: cargo build --release --bin ffi-stress -p nmp-testing

      - name: Run §G-S3 snapshot-pressure gate
        run: |
          set -euo pipefail
          echo "Running ffi-stress s3 --fail-on-gate --write-report"
          ./target/release/ffi-stress s3 \
            --fail-on-gate \
            --write-report

      # ADR-0055 R6-S4 feed-idle gate. `if: always()` so it runs (and reports)
      # even when §G-S3 above fails — the two gates are independent invariants.
      - name: Run ADR-0055 R6-S4 feed-idle gate
        if: always()
        run: |
          set -euo pipefail
          echo "Running ffi-stress feed-idle --fail-on-gate --write-report"
          ./target/release/ffi-stress feed-idle \
            --fail-on-gate \
            --write-report

      - name: Upload metrics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s3-feed-idle-metrics-${{ github.run_id }}
          path: |
            docs/perf/m10.5/S3/perf-report.json
            docs/perf/m10.5/S3/perf-report.md
            docs/perf/m10.5/S7/perf-report.json
            docs/perf/m10.5/S7/perf-report.md
          if-no-files-found: ignore
          retention-days: 14
