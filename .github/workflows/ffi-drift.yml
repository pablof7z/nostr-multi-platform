name: ffi-drift

# Catches C-header / Rust-FFI drift: `ios/Chirp/Chirp/Bridge/NmpCore.h` must
# stay in sync with every production `nmp_*` symbol exported from the Rust FFI
# archives the Chirp shell links. The gate statically normalizes Rust extern
# signatures and C prototypes, then compares symbols and same-name signatures.
#
# See ci/check-ffi-header-drift.sh for the full scope (which files it scans,
# how test-only injectors are excluded). This workflow only wires that script
# into CI so drift fails the PR automatically instead of relying on a manual run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ffi-header-drift:
    name: FFI header drift (NmpCore.h vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FFI drift self-test catches omitted files and signature drift
        run: bash ci/check-ffi-header-drift.sh --self-test

      - name: Check FFI header drift
        run: bash ci/check-ffi-header-drift.sh
