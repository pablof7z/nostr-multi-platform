name: doctrine-lint

# Enforces the four cardinal-doctrine grep gates:
#   - D0: no app nouns (NIP-29, group_id, pin_to, ...) in the kernel substrate
#         (nmp-core only; app-layer crates under apps/ are D0-exempt by design)
#   - D6: no panic / unwrap / expect / unreachable / todo outside test cfg
#   - D7: capability traits never name policy-decision verbs (retry, select, ...)
#   - D8: hot-path-marked fns never allocate per-event (format!, Vec::new, ...)
#         + no polling — `thread::sleep` is banned in non-test kernel code
#
# D0/D6/D7 + the hot-path half of D8 are nmp-core-scoped.
# The no-polling half of D8 is universally applicable; `--workspace-d8`
# re-runs *only* that check across every production crate AND app crate.
#
# Brainstorm item #8 — see docs/perf/parallel-work-brainstorm-2026-05-18.md
# Per-rule docstrings live in crates/nmp-testing/bin/doctrine-lint/rules/.
#
# This workflow runs the binary directly (catches new violations) AND the
# smoke test (asserts the lint itself behaves correctly against fixtures).

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

jobs:
  doctrine-lint:
    name: Doctrine grep gates (D0/D6/D7/D8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-doctrine-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-doctrine-lint-

      - name: Build doctrine-lint
        run: cargo build -p nmp-testing --bin doctrine-lint

      - name: Run doctrine-lint against nmp-core
        run: cargo run --quiet -p nmp-testing --bin doctrine-lint -- --crate nmp-core

      - name: Run doctrine-lint against nmp-browser-runtime
        run: cargo run --quiet -p nmp-testing --bin doctrine-lint -- --path crates/nmp-browser-runtime/src

      - name: Run D8 no-polling gate across all production crates and apps
        run: cargo run --quiet -p nmp-testing --bin doctrine-lint -- --workspace-d8

      - name: Run D18 native doctrine gate across Swift/Kotlin/Java
        run: cargo run --quiet -p nmp-testing --bin doctrine-lint -- --workspace-native

      - name: Run smoke tests (fixtures pass/fail per rule)
        run: cargo test -p nmp-testing --test doctrine_lint_smoke -- --nocapture

      - name: Run native doctrine smoke tests
        run: cargo test -p nmp-testing --test doctrine_native_smoke -- --nocapture

      - name: Run rule unit tests
        run: cargo test -p nmp-testing --bin doctrine-lint
