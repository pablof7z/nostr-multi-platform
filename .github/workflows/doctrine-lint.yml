name: doctrine-lint

# Enforces doctrine-lint's full ruleset (D0/D6/D7/D8/D9/D10/D11/D12/D13/D14/
# D15/D17/D19/D20/D21/D23/D24/D25/D26/D27/A6/action_namespace/
# nip29_kind_blind/no_raw_tap/product_raw_read/deleted_defaults) with
# enforcement surface equal to claimed footprint (#2761): `--workspace-full`
# walks every `crates/*/src/` tree, `crates/nmp-testing/bin/*` (excluding
# doctrine-lint itself), and every `apps/*/src/` tree, running the entire
# per-file ruleset. Each rule's own `file_in_scope` predicate — documented
# and unit-tested in `crates/nmp-testing/bin/doctrine-lint/rules/` — decides
# whether it fires on a given file, so "the rule claims to cover crate X"
# and "CI actually scans crate X" are now the same fact.
#
# D6 (no panic / unwrap / expect / unreachable / todo outside test cfg) is
# the one rule that stays deliberately bounded rather than reaching every
# walked file: it is enforced only against `nmp-core`, `nmp-browser-runtime`,
# and the seven curated protocol crates (see `rules/d6.rs`'s "Scope" doc) —
# widening it to the whole workspace is a separate, multi-PR campaign, not
# something this enforcement-surface fix silently does.
#
# `--workspace-native` (D18, Swift/Kotlin/Java) and `--workspace-d8`
# (no-polling only, kept for its own smoke-test coverage) run alongside.
#
# Brainstorm item #8 — see docs/perf/parallel-work-brainstorm-2026-05-18.md
# Per-rule docstrings live in crates/nmp-testing/bin/doctrine-lint/rules/.
#
# This workflow runs the binary directly (catches new violations) AND the
# smoke test (asserts the lint itself behaves correctly against fixtures).

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

jobs:
  doctrine-lint:
    name: Doctrine grep gates (full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-doctrine-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-doctrine-lint-

      - name: Build doctrine-lint
        run: cargo build -p nmp-testing --bin doctrine-lint

      - name: Warning ratchet - nmp-core
        run: RUSTFLAGS="-Dwarnings" cargo check -p nmp-core --lib --features test-support

      - name: Warning ratchet - nmp-native-runtime
        run: RUSTFLAGS="-Dwarnings" cargo check -p nmp-native-runtime --lib --features test-support,signer-broker

      - name: Warning ratchet - nmp-testing
        run: RUSTFLAGS="-Dwarnings" cargo check -p nmp-testing --bin doctrine-lint --test doctrine_lint_smoke

      - name: Run doctrine-lint across the full workspace
        run: cargo run --quiet -p nmp-testing --bin doctrine-lint -- --workspace-full

      - name: Run D18 native doctrine gate across Swift/Kotlin/Java
        run: cargo run --quiet -p nmp-testing --bin doctrine-lint -- --workspace-native

      - name: Run smoke tests (fixtures pass/fail per rule)
        run: cargo test -p nmp-testing --test doctrine_lint_smoke -- --nocapture

      - name: Run native doctrine smoke tests
        run: cargo test -p nmp-testing --test doctrine_native_smoke -- --nocapture

      - name: Run layer inversion doctrine lint
        run: cargo test -p nmp-testing --test layer_inversion_doctrine_lint -- --nocapture

      - name: Run rule unit tests
        run: cargo test -p nmp-testing --bin doctrine-lint
