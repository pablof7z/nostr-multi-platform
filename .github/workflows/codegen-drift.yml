name: codegen-drift

# Codegen and FlatBuffers binding drift gates. Fails any PR whose generated
# outputs or checked-in bindings differ from a fresh run.
#
# This workflow hosts the per-language `flatc` binding drift gates that
# byte-diff the checked-in FlatBuffers bindings against a fresh pinned-flatc
# run, so .fbs schemas and their Rust/TS bindings can never silently drift:
#   rust-flatc-drift            all checked-in Rust *_generated.rs bindings
#                               under crates/*/src, auto-paired with
#                               crates/*/schema/*.fbs (Rust, 25.12.19)
#   typescript-flatc-drift      transport + feed + KRPR
#                               + KRDG, for every checked-in web TS tree
#                                                         (TS,     25.9.23)
# Regenerate all checked-in flatc bindings locally with:
#   bash ci/regenerate-flatbuffers.sh
# Each gate prints that single entrypoint on failure.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  registry-codegen-drift:
    name: registry codegen drift (Rust/TS surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check FlatBuffers runtime pins
        run: bash ci/check-flatbuffers-version-pins.sh

      # ADR-0053 / Workstream-E4 — the kernel built-in projection key const
      # (crates/nmp-core/src/kernel/update/builtin_projection_keys.generated.rs)
      # is DERIVED from the SAME projection registry. Fails any PR whose
      # checked-in const differs from a fresh run, so the kernel built-in key
      # set cannot drift from what codegen decodes (nmp-core's
      # `builtin_projection_keys_const_matches_runtime` separately pins it
      # against the kernel's actual make_update emission).
      - name: Check kernel built-in key codegen is up to date
        run: cargo run --quiet -p nmp-codegen -- gen builtin-keys --check

      # #1723 (epic #1719) — the kernel built-in projection REVISION dependency
      # table (crates/nmp-core/src/kernel/projection_rev/builtin_projection_deps.generated.rs)
      # is DERIVED from the SAME neutral projection contract as the built-in key
      # set (projection_contract::PROJECTION_CONTRACT). Fails any PR whose
      # checked-in table differs from a fresh run, so the dependency table, the
      # built-in key set, and the contract cannot drift from each other.
      - name: Check kernel built-in dependency-table codegen is up to date
        run: cargo run --quiet -p nmp-codegen -- gen builtin-deps --check

      # #1723 (epic #1719) — the kernel's presence-classification key sets
      # (DRAIN_PROJECTION_KEYS / CONDITIONAL_PRESENCE_KEYS in
      # crates/nmp-core/src/kernel/projection_rev/presence_keys.generated.rs) are
      # DERIVED from the SAME contract's `presence_policy` column. Fails any PR
      # whose checked-in sets differ from a fresh run, so the kernel's presence
      # semantics cannot drift from the contract.
      - name: Check kernel presence-key codegen is up to date
        run: cargo run --quiet -p nmp-codegen -- gen presence-keys --check

      # #1723 (epic #1719) — the per-projection producer constants
      # (*_SCHEMA_ID / *_FILE_IDENTIFIER / *_SCHEMA_VERSION) the nmp-core kernel +
      # actor *_fb.rs codecs AND the Tier-1 NIP-crate *_fb.rs codecs
      # (nmp-nip17 / nmp-nip29 / nmp-nip51) include! (one
      # *_producer_consts.generated.rs each) are DERIVED from each projection's
      # PROJECTION_CONTRACT entry (schema_id / file_identifier / version columns).
      # The generator writes by repo-relative path, so it covers the NIP crates'
      # source trees too even though those crates do not depend on nmp-codegen.
      # Fails any PR whose checked-in files differ from a fresh run, so the
      # producer wire-identity constants cannot drift from the contract.
      - name: Check per-projection producer-const codegen is up to date
        run: cargo run --quiet -p nmp-codegen -- gen producer-consts --check

      # ADR-0064 §3 (#1783) — the generated typed action-builders
      # (`ActionBuilders.generated.ts`) are DERIVED from the `ACTION_BUILDERS`
      # registry. Fails any PR whose checked-in builders differ from a fresh run,
      # so the builders cannot drift from the registered modules.
      - name: Check action-builder codegen is up to date
        run: |
          cargo run --quiet -p nmp-codegen -- gen action-builders --platform ts --check \
            --out web/packages/runtime-web/src/actionBuilders.generated.ts

      # #1931 — the native write boundary must stay behind generated action
      # builders for every migrated namespace. The self-test proves the gate
      # trips when Swift/Kotlin production code hand-spells a migrated
      # namespace; the live check excludes generated builder outputs and test
      # sources, then fails on any remaining native literal.
      - name: Native action-boundary self-test catches hand-spelled migrated namespaces
        run: bash ci/check-native-action-boundary.sh --self-test

      - name: Check native action-boundary uses generated builders
        run: bash ci/check-native-action-boundary.sh

      # #2487 / M14-D — after the reusable nmp-ffi framework ABI deletion, iOS
      # callers must not import deleted raw headers or call migrated framework C
      # symbols. App-scoped gallery bridge symbols are allowed; migrated
      # framework APIs belong behind crates/nmp-uniffi generated bindings.
      - name: iOS clean-break self-test catches deleted nmp-ffi C callers
        run: bash ci/check-ios-uniffi-clean-break.sh --self-test

      - name: Check iOS callers are clean of deleted nmp-ffi raw symbols
        run: bash ci/check-ios-uniffi-clean-break.sh

      # #2599 — nmp-gallery is the stock component showcase. Its checked-in
      # SwiftUI and Compose registry copies must stay mechanically synced with
      # crates/nmp-component-registry/registry; Compose differs only by the app package line.
      - name: Check nmp-gallery component registry copies are in sync
        run: python3 ci/check-gallery-registry-drift.py

  # PR-B (#991/#979), hardened by #1931 — Rust flatc binding drift gate. Every
  # checked-in Rust FlatBuffers binding under crates/*/src/**/<stem>_generated.rs
  # must have an owning crates/<crate>/schema/<stem>.fbs schema and must be
  # byte-identical to a fresh `flatc --rust` run (rustfmt'd), with flatc pinned
  # to the `flatbuffers` Rust runtime pin (25.12.19). Catches both stale
  # bindings and omitted generated bindings.
  rust-flatc-drift:
    name: Rust flatc drift (all checked-in Rust bindings vs schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pinned flatc 25.12.19
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip
          unzip -o /tmp/flatc.zip -d /tmp/flatc-bin
          sudo install -m 0755 /tmp/flatc-bin/flatc /usr/local/bin/flatc
          flatc --version

      - name: Rust flatc discovery self-test catches omitted bindings
        run: bash ci/check-rust-flatc-drift.sh --self-test

      - name: Check Rust FlatBuffers bindings are in sync with the schemas
        run: bash ci/check-rust-flatc-drift.sh

      # ADR-0064 / S2 (#1750) — DispatchEnvelope fail-closed gates: the write
      # envelope keeps its own file identifier (NMPD), the schema_version
      # tripwire field, an opaque [ubyte] payload (NOT a union), the
      # MAX_DISPATCH_ENVELOPE_BYTES size bound in the decode path, and no two
      # ActionModules share a namespace. --self-test first proves every gate
      # trips on its bad case (asserts the negative), then the live check runs.
      - name: DispatchEnvelope fail-closed gates trip on the bad case
        run: bash ci/check-dispatch-envelope-gates.sh --self-test

      - name: DispatchEnvelope fail-closed gates hold for the live schema
        run: bash ci/check-dispatch-envelope-gates.sh

  # Issue #1209 + #1512 — TypeScript flatc drift gate. Every checked-in web TS
  # tree (e.g. web/nmp-gallery) must be byte-identical to a fresh `flatc --ts`
  # run over the transport/feed/KRPR/KRDG schemas, with flatc pinned to the
  # Web/TypeScript runtime pin (25.9.23, distinct from the Rust pin of
  # 25.12.19). Regenerate locally with
  # `bash ci/regenerate-flatbuffers.sh`.
  typescript-flatc-drift:
    name: TypeScript flatc drift (web TS generated trees vs schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned flatc 25.9.23
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.9.23/Linux.flatc.binary.clang++-18.zip
          unzip -o /tmp/flatc.zip -d /tmp/flatc-bin
          sudo install -m 0755 /tmp/flatc-bin/flatc /usr/local/bin/flatc
          flatc --version

      - name: Check TypeScript transport bindings are in sync with the schema
        run: bash ci/check-ts-flatc-drift.sh

  # #2389 — UniFFI binding drift gate. The checked-in Swift and Kotlin bindings
  # under crates/nmp-uniffi/generated/ must be byte-identical to a fresh
  # uniffi-bindgen run. Regenerate locally with:
  #   bash ci/check-uniffi-bindings-drift.sh --regen
  uniffi-bindings-drift:
    name: UniFFI binding drift (Swift + Kotlin vs Rust interface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check UniFFI bindings are in sync with the Rust interface
        run: bash ci/check-uniffi-bindings-drift.sh
