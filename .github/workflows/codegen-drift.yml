name: codegen-drift

# V6 Stage 1 — Swift `Decodable` emitter drift gate. The Rust projection
# types in `nmp-core` (plus the seven NIP-crate projection types in
# Stage 2/3) are the single source of truth for the Swift `Decodable`
# mirrors at `ios/Chirp/Chirp/Bridge/Generated/KernelTypes.generated.swift`.
# This workflow runs the emitter in `--check` mode and fails any PR whose
# generated Swift differs from a fresh run.
#
# Regenerate locally with:
#   cargo run -p nmp-core --features codegen-schema \
#       --bin dump_projection_schemas \
#       | cargo run -p nmp-codegen -- gen swift
#
# See `docs/architecture-audit/v6-codegen-plan.md` §5d and `crates/
# nmp-codegen/src/swift.rs` for the emitter itself.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  swift-codegen-drift:
    name: Swift codegen drift (KernelTypes.generated.swift vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check FlatBuffers runtime pins
        run: bash ci/check-flatbuffers-version-pins.sh

      # Compile + run the schema dump bin once; pipe its output into the
      # emitter's `--check` mode. The bin requires the `codegen-schema`
      # feature; the emitter does not (it is a plain Rust binary).
      - name: Check Swift codegen is up to date
        run: |
          cargo run --quiet -p nmp-core --features codegen-schema \
              --bin dump_projection_schemas \
            | cargo run --quiet -p nmp-codegen -- gen swift --check

      # V6 Stage 4 (consumer-side) — the generated typed-FlatBuffer-sidecar
      # decoders (`TypedProjectionDecoders.generated.swift`). Driven by the
      # registry's `typed_sidecar` metadata; no schema-document stdin needed.
      # Fails any PR whose generated Swift differs from a fresh run, so the
      # decoders cannot drift from the registry.
      - name: Check typed-decoder codegen is up to date
        run: cargo run --quiet -p nmp-codegen -- gen typed-decoders --check

  # PR-B (#991/#979) — Rust flatc transport-binding drift gate. The checked-in
  # bindings at crates/nmp-core/src/transport/generated/nmp_update_generated.rs
  # must be byte-identical to a fresh `flatc --rust` run (rustfmt'd) over
  # crates/nmp-core/schema/nmp_update.fbs, with the flatc version pinned to the
  # `flatbuffers` Rust runtime pin (25.12.19). Catches the gap that let a
  # `(deprecated)` schema field keep stale accessors in the checked-in
  # bindings. Regenerate locally per the instructions the script prints.
  rust-flatc-drift:
    name: Rust flatc drift (nmp_update_generated.rs vs nmp_update.fbs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pinned flatc 25.12.19
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip
          unzip -o /tmp/flatc.zip -d /tmp/flatc-bin
          sudo install -m 0755 /tmp/flatc-bin/flatc /usr/local/bin/flatc
          flatc --version

      - name: Check Rust transport bindings are in sync with the schema
        run: bash ci/check-rust-flatc-drift.sh

  # Issue #1093 — Kotlin flatc transport-binding drift gate. The checked-in
  # Kotlin bindings at android/app/src/main/java/nmp/transport/*.kt must be
  # identical to a fresh `flatc --kotlin` run over nmp_update.fbs, with flatc
  # pinned to the Android/Kotlin runtime pin (25.2.10, distinct from the
  # Rust+Swift pin of 25.12.19). Regenerate locally per the instructions in
  # ci/check-kotlin-flatc-drift.sh.
  kotlin-flatc-drift:
    name: Kotlin flatc drift (android/app/src/main/java/nmp/transport/*.kt vs nmp_update.fbs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned flatc 25.2.10
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.2.10/Linux.flatc.binary.clang++-18.zip
          unzip -o /tmp/flatc.zip -d /tmp/flatc-bin
          sudo install -m 0755 /tmp/flatc-bin/flatc /usr/local/bin/flatc
          flatc --version

      - name: Check Kotlin transport bindings are in sync with the schema
        run: bash ci/check-kotlin-flatc-drift.sh

      # Issue #1093 — golden fixture parity gate. The two copies of
      # update_frame_tier3_golden_v1.fb.hex (Rust crate + Android resources)
      # must be byte-identical. Regenerate both via:
      #   cargo test -p nmp-core -- tier3_golden_fixture_matches_encoder --nocapture
      - name: Assert golden fixture copies are byte-identical
        run: |
          cmp \
            crates/nmp-core/tests/fixtures/update_frame_tier3_golden_v1.fb.hex \
            android/app/src/test/resources/fixtures/update_frame_tier3_golden_v1.fb.hex \
          || { echo "golden fixture copies diverged — regenerate BOTH via tier3_golden_fixture_matches_encoder"; exit 1; }

  # Issue #1209 — TypeScript flatc transport-binding drift gate. The checked-in
  # TS bindings at web/chirp/src/nmp/generated/nmp/ must be byte-identical to a
  # fresh `flatc --ts` run over nmp_update.fbs, with flatc pinned to the
  # Web/TypeScript runtime pin (25.9.23, distinct from the Rust+Swift pin of
  # 25.12.19 and the Kotlin pin of 25.2.10). Regenerate locally per the
  # instructions in ci/check-ts-flatc-drift.sh.
  typescript-flatc-drift:
    name: TypeScript flatc drift (web/chirp/src/nmp/generated/nmp/ vs nmp_update.fbs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned flatc 25.9.23
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.9.23/Linux.flatc.binary.clang++-18.zip
          unzip -o /tmp/flatc.zip -d /tmp/flatc-bin
          sudo install -m 0755 /tmp/flatc-bin/flatc /usr/local/bin/flatc
          flatc --version

      - name: Check TypeScript transport bindings are in sync with the schema
        run: bash ci/check-ts-flatc-drift.sh
