name: supply-chain

# Runs cargo-audit (RUSTSEC vulnerability advisories) and cargo-deny
# (license compliance + duplicate-dep detection + advisory checks) on every
# PR and every push to master.  Caches the cargo registry so subsequent runs
# are fast.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + advisory DB
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/advisory-db
          key: cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-audit-

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # Exit 0 on warnings (unmaintained crates) to avoid blocking PRs for
        # issues with no available fix. Actual vulnerabilities still fail the
        # build. See docs/perf/supply-chain-baseline.md for current warnings
        # and the full advisory inventory including RUSTSEC-2026-0124.
        #
        # RUSTSEC-2026-0124 (libcrux-aead < 0.0.8) is a temporary ignore:
        # hpke-rs-libcrux pins libcrux-aead ^0.0.7 and upstream has not yet
        # published a compatible release for libcrux-aead 0.0.8+.
        # REMOVE this --ignore flag as soon as Cargo.lock no longer pulls in
        # libcrux-aead 0.0.7. See docs/perf/supply-chain-baseline.md §Post-
        # baseline advisory: RUSTSEC-2026-0124 for the resolution path.
        #
        # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml < 0.41.0) are
        # temporarily ignored under #2711 because wayland-scanner 0.31.10 is
        # the latest compatible upstream release and pins quick-xml ^0.39.
        run: cargo audit --ignore RUSTSEC-2026-0124 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  deny:
    name: cargo deny (licenses + bans + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deny-

      - name: Run cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Run all checks: advisories, bans, licenses, sources.
          command: check
          # Use the deny.toml at the repo root.
          manifest-path: Cargo.toml
          # Treat advisory errors as failures; warnings are printed but don't
          # block the build.  See deny.toml [advisories].ignore for known-safe
          # exceptions.
          arguments: --all-features

  vendored-artifact-integrity:
    name: vendored SQLite-WASM artifact integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The vendored SQLite-WASM artifact (crates/nmp-sqlite-wasm/vendor/) is a
      # public-domain binary outside the Cargo graph, so cargo-deny/cargo-audit
      # cannot see it. This SHA-256 re-verify is its substitute supply-chain
      # control (#1007 PR-2). See crates/nmp-sqlite-wasm/vendor/PROVENANCE.md.
      - name: Verify vendored SQLite-WASM artifact SHA-256
        run: bash ci/verify-sqlite-wasm-artifact.sh
