name: browser-runtime

# CI gates for crates/nmp-browser-runtime (issue #2081, epic #2045).
#
# nmp-browser-runtime is built three ways in this repo:
#
#   Mode A — wasm-shaped (default features):
#     `cargo build -p nmp-browser-runtime`
#     All deps use `default-features = false`, so native-only crates (mio, lmdb,
#     nmp-nip01, nmp-nip47, nmp-ffi, …) are absent from the feature graph.
#     This is the shape the actual wasm32 binary will have, validated quickly
#     on the host target before the true wasm32 compile gate below.
#
#   Mode B — feature-unified (nmp-defaults default features):
#     `cargo build -p nmp-browser-runtime -p nmp-defaults`
#     nmp-defaults pulls in the native-feature variants of nmp-core and shared
#     crates (lmdb, nmp-nip01 subscribers, NWC, …).  This is the build shape
#     used by the desktop/server runtime that shares the same nmp-core.
#     Catching non-exhaustive `cfg`-enum match arms requires both modes because
#     native cfg arms are only reachable in Mode B.
#
#   Mode C — true wasm32:
#     `cargo build --target wasm32-unknown-unknown`
#     This catches cfg(target_arch = "wasm32") code that native feature-shaping
#     cannot compile, including the OPFS-SQLite store path and the browser runtime
#     wasm artifact. (nmp-wasm was deleted in #2202; nmp-browser-runtime::wasm
#     is the sole wasm-bindgen ABI glue.)
#     secp256k1-sys' vendored C library needs a C compiler with a wasm backend,
#     so the gate installs clang + lld and points the wasm32 C build at them.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/browser-runtime.yml"
      - "crates/nmp-browser-runtime/**"
      - "crates/nmp-network/**"
      - "crates/nmp-signers/**"
      - "crates/nmp-signer-iface/**"
      - "crates/nmp-defaults/**"
      - "crates/nmp-substrate-defaults/**"
      - "crates/nmp-store/**"
      - "crates/nmp-sqlite-wasm/**"
      - "crates/nmp-core/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/browser-runtime.yml"
      - "crates/nmp-browser-runtime/**"
      - "crates/nmp-network/**"
      - "crates/nmp-signers/**"
      - "crates/nmp-signer-iface/**"
      - "crates/nmp-defaults/**"
      - "crates/nmp-substrate-defaults/**"
      - "crates/nmp-store/**"
      - "crates/nmp-sqlite-wasm/**"
      - "crates/nmp-core/**"

jobs:
  # Mode A — wasm-shaped feature graph (native crates absent).
  # Validates the crate compiles and is lint-clean when all deps use
  # `default-features = false`, matching the wasm32 production feature graph.
  wasm-shaped:
    name: nmp-browser-runtime (wasm-shaped, native crates absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Swatinem/rust-cache fingerprints target/ by crate + feature set +
      # Cargo.lock so a dep change only re-uploads the changed slice.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: browser-runtime-wasm-shaped

      - name: Build (wasm-shaped)
        run: cargo build -p nmp-browser-runtime

      # --no-deps restricts lints to nmp-browser-runtime itself; omitting it
      # causes pre-existing warnings in nmp-planner (large_enum_variant),
      # nmp-signer-iface (double_must_use), and nmp-network relay_worker to
      # fail the job, which are tracked separately and not in scope here.
      - name: Clippy (wasm-shaped, -D warnings, crate-only)
        run: cargo clippy -p nmp-browser-runtime --no-deps -- -D warnings

      # --no-run compiles all test binaries without executing them; this
      # catches compile-time errors in test code under the wasm-shaped graph.
      - name: Compile tests (wasm-shaped, --no-run)
        run: cargo test -p nmp-browser-runtime --no-run

  # Mode B — feature-unified build.
  # nmp-defaults is built WITH its default features, which pulls in the
  # native-feature variants of nmp-core and shared crates (lmdb, nmp-nip01,
  # NWC, …).  This build catches non-exhaustive cfg-enum match arms that are
  # only reachable when the native feature flag is active via feature
  # unification.  Tests are executed (not just compiled) in this mode.
  feature-unified:
    name: nmp-browser-runtime (feature-unified, nmp-core/native active)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: browser-runtime-feature-unified

      # Building nmp-defaults with its default features causes feature
      # unification of nmp-core: both wasm-shaped and native cfg arms are
      # compiled in the same invocation, catching non-exhaustive match arms.
      - name: Build (feature-unified)
        run: cargo build -p nmp-browser-runtime -p nmp-defaults

      # Clippy targets only nmp-browser-runtime (not nmp-defaults) because
      # nmp-defaults carries pre-existing lints (derivable_impls, dead_code,
      # etc.) that are tracked separately.  --no-deps excludes transitive deps.
      - name: Clippy (feature-unified, -D warnings, nmp-browser-runtime only)
        run: cargo clippy -p nmp-browser-runtime --no-deps -- -D warnings

      # Execute the test suite under the feature-unified graph to prove runtime
      # behaviour is correct when native features are present.
      - name: Test (feature-unified, executed)
        run: cargo test -p nmp-browser-runtime

  # Blocking wasm32 compile gate. This is the only job in this workflow that
  # actually compiles cfg(target_arch = "wasm32") code; the native jobs above
  # only validate wasm-shaped feature graphs on the host target.
  wasm32:
    name: browser wasm crates (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: browser-runtime-wasm32

      # secp256k1-sys needs a C compiler that can target wasm32. clang ships a
      # wasm backend, lld provides wasm-ld, and llvm provides llvm-ar.
      - name: Install wasm C toolchain (clang + lld + llvm-ar)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build nmp-store OPFS backend (wasm32-unknown-unknown)
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo build -p nmp-store --target wasm32-unknown-unknown --features opfs-sqlite-backend

      - name: Build nmp-browser-runtime (wasm32-unknown-unknown)
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo build -p nmp-browser-runtime --target wasm32-unknown-unknown --features wasm
