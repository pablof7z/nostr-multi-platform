name: file-size-gate

# Enforces AGENTS.md 300 LOC warn / 500 LOC hard cap on hand-authored source.
# In CI we check files changed by the current push/PR so legacy debt does not
# fail unrelated work; the full-tree scan remains available locally.
#
# NOTE: brainstorm item #6 (requests.rs 574 LOC split) is resolved — the file
# was already decomposed into kernel/requests/{mod,profile,thread}.rs before
# this gate landed. UniFFI-generated bindings are exempted via .file-size-ignore.

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

jobs:
  file-size:
    name: File-size check (300 warn / 500 hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check file sizes (changed files in this run)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM_REF="${{ github.event.pull_request.base.sha }}"
            TO_REF="${{ github.event.pull_request.head.sha }}"
            # On a PR, trust the baseline as it exists at the PR base: a PR must
            # not both grow an over-limit file and raise its baseline in the same
            # reviewable diff.
            BASELINE_REF="$FROM_REF"
          else
            FROM_REF="${{ github.event.before }}"
            TO_REF="${{ github.sha }}"
            # On a push, trust the baseline in the pushed commit itself. The
            # branch already contains any merge / baseline refresh, so comparing
            # its files against the PREVIOUS commit's stale baseline would raise
            # false "expansion" failures for legitimately-refreshed entries.
            BASELINE_REF="$TO_REF"
          fi

          # Initial branch pushes use an all-zero "before" SHA. Rebased and
          # force-pushed branches can point github.event.before at a commit that
          # is orphaned or no longer an ancestor of the pushed commit. Keep the
          # push lane useful by falling back to the branch's default-branch
          # merge base; for default-branch pushes, use the first parent if
          # there is one.
          DEFAULT_BRANCH="origin/${{ github.event.repository.default_branch }}"
          if [[ "$FROM_REF" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "$FROM_REF^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$FROM_REF" "$TO_REF"; then
            if [[ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]] \
              && git rev-parse --verify "$DEFAULT_BRANCH" >/dev/null 2>&1; then
              FROM_REF="$(git merge-base "$TO_REF" "$DEFAULT_BRANCH")"
            else
              FROM_REF="$(git rev-list --parents -n 1 "$TO_REF" | awk '{print $2}')"
              if [[ -z "$FROM_REF" ]]; then
                FROM_REF="$(git rev-list --max-parents=0 "$TO_REF")"
              fi
            fi
          fi

          bash .githooks/check-file-size.sh \
            --from-ref "$FROM_REF" --to-ref "$TO_REF" \
            --baseline-ref "$BASELINE_REF"

      - name: Smoke test — fixture must trigger hard-cap report
        run: |
          # Verify the gate can actually detect a violation.
          # --dry-run exits 0 even on violations, so this step always passes;
          # the grep on the output is the real assertion.
          OUTPUT=$(bash .githooks/check-file-size.sh --dry-run \
            --force-include crates/nmp-testing/fixtures/file-size-gate/oversized.rs 2>&1 || true)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "HARD-cap violation"; then
            echo "SMOKE TEST FAILED: gate did not report a hard-cap violation for the fixture." >&2
            exit 1
          fi
          echo "Smoke test passed — gate correctly identified oversized.rs as a violation."

      - name: Smoke test — expanded coverage catches Kotlin
        run: |
          mkdir -p target/file-size-gate-smoke
          yes "// oversized Kotlin fixture" | head -n 501 > target/file-size-gate-smoke/oversized.kt
          OUTPUT=$(bash .githooks/check-file-size.sh --dry-run \
            --force-include target/file-size-gate-smoke/oversized.kt 2>&1 || true)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "HARD-cap violation"; then
            echo "SMOKE TEST FAILED: gate did not report a Kotlin hard-cap violation." >&2
            exit 1
          fi

      - name: Smoke test — baseline permits current debt but blocks expansion
        run: |
          mkdir -p target/file-size-gate-smoke
          yes "// baseline fixture" | head -n 501 > target/file-size-gate-smoke/baselined.kt
          printf "target/file-size-gate-smoke/baselined.kt\t501\n" > target/file-size-gate-smoke/baseline

          OUTPUT=$(bash .githooks/check-file-size.sh --dry-run \
            --baseline-file target/file-size-gate-smoke/baseline \
            --force-include target/file-size-gate-smoke/baselined.kt 2>&1 || true)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "BASELINE hard-cap debt"; then
            echo "SMOKE TEST FAILED: baseline did not permit an unchanged over-limit file." >&2
            exit 1
          fi

          echo "// one more line" >> target/file-size-gate-smoke/baselined.kt
          if bash .githooks/check-file-size.sh \
            --baseline-file target/file-size-gate-smoke/baseline \
            --force-include target/file-size-gate-smoke/baselined.kt; then
            echo "SMOKE TEST FAILED: baseline expansion should fail." >&2
            exit 1
          fi
          echo "Smoke test passed — baseline expansion is rejected."
