name: test

# Runs `cargo test` on every PR and every push to master. This is the first
# build/test gate in CI — the other workflows (doctrine-lint, file-size-gate,
# supply-chain) lint and audit but never compile or run the test suite.
#
# Excluded crates (do not build on a bare `ubuntu-latest` runner):
#   - nmp-android-ffi : standalone `[workspace]` table, not a parent member.
#   - nmp-app-chirp   : app crate tests compile separately below with
#                       no default features so host-only optional stacks do
#                       not enter the workspace-wide lane.
#   - nmp-gallery-desktop : uses iced, which pulls `winit` needing
#                       libxkbcommon/wayland/xcb apt packages absent on the
#                       bare runner. It is a thin GUI shell with no tests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The full workspace build + all test binaries (secp256k1, lmdb, openmls,
      # flatbuffers, …) exhaust the ~14 GB free on a bare `ubuntu-latest`
      # runner during linking ("No space left on device" / ld Bus error). Drop
      # the preinstalled SDKs we never use to reclaim ~25 GB before building.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test (default features)
        run: cargo test --workspace --exclude nmp-android-ffi --exclude nmp-app-chirp --exclude nmp-gallery-desktop

      # Issue #1553 — compile app-crate test targets that the workspace lane
      # intentionally excludes. `--no-run` is enough to catch E0560-class wire
      # shape breaks in integration tests such as typed_feed_parity.rs, while
      # `--no-default-features` keeps host-only optional stacks out of this
      # Ubuntu gate.
      - name: cargo test --no-run (nmp-app-chirp test targets)
        run: cargo test -p nmp-app-chirp --no-run --no-default-features

      - name: cargo test (lmdb-backend)
        run: cargo test -p nmp-core --features lmdb-backend
        env:
          RUSTFLAGS: ""

      # Epic #1523 cache adoption acceptance gates.
      #
      # cache_no_materialization_gate: proves that early ControlFlow::Break in
      #   query_visit stops LMDB event conversion immediately — no over-scan.
      # cache_serve_replay_fixtures: Mem ≡ LMDB parity fixtures (5 query shapes,
      #   both backends via for_each_backend!).
      - name: cargo test nmp-testing (lmdb acceptance gates)
        run: |
          cargo test -p nmp-testing --features lmdb-backend --test cache_no_materialization_gate
          cargo test -p nmp-testing --features lmdb-backend --test cache_serve_replay_fixtures
        env:
          RUSTFLAGS: ""

      # ADR-0048 Stage 2 NIP-55 proof gate (advances #1124).
      #
      # `cargo test --workspace` (above) runs nmp-ffi with default features,
      # which excludes the `external-signer` feature. The signin_loop_* tests
      # in `crates/nmp-ffi/src/external_signer.rs` are therefore skipped by
      # the default lane. This step adds the explicit `--features
      # external-signer` pass to prove those tests are run and green.
      #
      # The feature is cheap: it activates `nmp-signer-iface` + `nmp-signers`
      # (already compiled for the default test run), so this step costs only
      # the incremental delta for the feature-gated code paths.
      - name: cargo test (nmp-ffi --features external-signer)
        run: cargo test -p nmp-ffi --features external-signer

      # ADR-0048 Stage 2 — nmp-app-gallery android-ffi feature check.
      #
      # `nmp-app-gallery` is a workspace member, so `cargo test --workspace`
      # compiles it with default features. The `android-ffi` feature enables
      # the JNI shim surface (`Java_org_nmp_gallery_*` symbols, `jni` dep)
      # that no other workspace build exercises. This `cargo check` catches
      # compile breaks in the JNI glue without requiring a cross-compiled .so
      # or an emulator.
      #
      # Host-target check only (same posture as `nmp-android-ffi` below).
      - name: cargo check (nmp-app-gallery --features android-ffi)
        run: cargo check -p nmp-app-gallery --features android-ffi

  android-ffi:
    # ADR-0048 Stage 2 — nmp-android-ffi host test gate (advances #1124).
    #
    # The crate has its own `[workspace]` table, so `cargo build/test
    # --workspace` from the repo root never touches it — a Rust-level break
    # there is otherwise invisible to CI until an Android build runs.
    #
    # This job runs THREE gates of increasing fidelity:
    #   1. `cargo test` — host unit + integration tests (JNI symbol parity, Rust
    #      re-export coverage, and the #1218 openssl-src pin guard). Hermetic
    #      string-search over `include_str!` source/manifest files; links the
    #      test binary against the host target, no NDK or emulator needed.
    #   2. `cargo check --features marmot` — fast host-target scope check for the
    #      Marmot feature graph (catches Rust import/trait errors).
    #   3. `cargo ndk ... x86_64-linux-android` — a REAL single-ABI cross-compile
    #      that exercises the vendored-OpenSSL build the APK depends on. This is
    #      the gate that would have caught #1218 (host check #2 is blind to it).
    name: cargo test (android-ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/nmp-android-ffi/target
          key: ${{ runner.os }}-cargo-android-ffi-${{ hashFiles('crates/nmp-android-ffi/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-ffi-

      - name: cargo test (nmp-android-ffi standalone workspace)
        run: cd crates/nmp-android-ffi && cargo test

      # Marmot-feature host compile gate.
      #
      # The cargoNdk task in android/app/build.gradle.kts passes `--features
      # marmot` when building the APK, but CI previously only ran `cargo test`
      # (no features), so a Rust-level compile break under `--features marmot`
      # was invisible until a developer ran a full Android build locally.
      #
      # This step catches scope/trait/import errors (e.g. missing
      # `jstring_to_cstring` import, missing `zeroize std` feature, missing
      # `libsqlite3-sys` vendored OpenSSL dep) on the host target. It is fast
      # because it never cross-compiles, but for that same reason it is BLIND to
      # NDK-only failures — most notably #1218, where the vendored OpenSSL
      # `providers/ml_kem` source failed to cross-compile for
      # `x86_64-linux-android` under NDK 26 while the host build stayed green.
      - name: cargo check (nmp-android-ffi --features marmot)
        run: cd crates/nmp-android-ffi && cargo check --features marmot

      # Real NDK cross-compile gate — closes the #1218 blind spot.
      #
      # The host `cargo check` above cannot see vendored-OpenSSL cross-compile
      # breakage because no Android target is built. This step runs the SAME
      # `cargo ndk` invocation the APK uses (android/app/build.gradle.kts), but
      # scoped to a SINGLE ABI: `x86_64-linux-android`. x86_64 is the cheapest
      # ABI to build in CI (native host arch — no QEMU) AND is precisely the ABI
      # that #1218 broke, so it is the highest-signal/lowest-cost gate. A green
      # here proves the vendored OpenSSL (pinned to a pre-ml_kem 3.4.x line)
      # actually cross-compiles, not merely that the Rust scopes resolve.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Add x86_64-linux-android Rust target
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # `nttld/setup-ndk` exports ANDROID_NDK_HOME into the job env, which
      # `cargo ndk` reads to locate the clang cross-toolchain — no explicit
      # passthrough needed.
      - name: cargo ndk cross-compile (x86_64, --features marmot)
        run: |
          cd crates/nmp-android-ffi
          cargo ndk -t x86_64 -o ./jniLibs-ci build --release --features marmot
