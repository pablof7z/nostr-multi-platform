name: test

# Runs `cargo nextest` on every PR and every push to master. This is the first
# build/test gate in CI — the other workflows (doctrine-lint, file-size-gate,
# supply-chain) lint and audit but never compile or run the test suite.
#
# The test suite is split into FIVE parallel jobs to cut wall time from ~21m
# (single sequential job) to ~10m (parallel critical path). Each job restores
# its own slice of the target cache via Swatinem/rust-cache, which does
# fingerprinted incremental caching instead of the old all-or-nothing 9.8GB
# actions/cache blob that cost ~6m of pure I/O per run.
#
# Excluded crates (do not build on a bare `ubuntu-latest` runner):
#   - nmp-chirp-android-ffi : standalone `[workspace]` table, not a parent
#     member. Gated by the separate `android-ffi` job below.
#   - nmp-app-chirp   : app crate tests execute separately in the `app-crates`
#     job with no default features so optional app stacks do not enter the
#     workspace-wide lane.
#   - nmp-gallery-desktop : uses iced, which pulls `winit` needing
#     libxkbcommon/wayland/xcb apt packages absent on the bare runner. It is
#     a thin GUI shell with no tests.
#
# Serial-test crates (run in the `serial-crates` job with --test-threads=1):
#   - nmp-defaults, nmp-nip29, nmp-testing : integration tests that spin up
#     real `NmpApp` instances via `nmp_app_new`. Each test binary has a
#     `static SERIAL: Mutex<()>` guard, but nextest runs each test binary in
#     its own process so the mutex does not cross binary boundaries. Running
#     these crates with --test-threads=1 serializes test execution within the
#     nextest invocation, preventing the global-actor-thread races that
#     caused op_feed_* failures under parallel nextest on Linux CI.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Shared setup steps for all four test jobs. Each job calls these via
  # `uses: ./` (not supported) — instead we duplicate the 3 setup steps. The
  # duplication is deliberate: GitHub Actions lacks reusable step fragments
  # without composite actions, and a composite action here would obscure the
  # per-job cache key and feature flags that differ across lanes.

  workspace:
    name: cargo nextest (workspace, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The full workspace build + all test binaries (secp256k1, lmdb,
      # openmls, flatbuffers, …) exhaust the ~14 GB free on a bare
      # `ubuntu-latest` runner during linking. Drop the preinstalled SDKs we
      # never use to reclaim ~25 GB before building.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Swatinem/rust-cache fingerprints the target/ directory by crate +
      # feature set + Cargo.lock, so a dep change only re-uploads the slice
      # that actually changed. This replaces the old actions/cache@v4 entry
      # that uploaded the entire 9.8GB target/ dir on every Cargo.lock bump
      # (~2.5m upload + ~3.5m restore of pure I/O waste per run).
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace-default

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest (workspace, default features)
        run: |
          cargo nextest run --workspace --no-fail-fast \
            --exclude nmp-chirp-android-ffi \
            --exclude nmp-app-chirp \
            --exclude nmp-gallery-desktop \
            --exclude nmp-defaults \
            --exclude nmp-nip29 \
            --exclude nmp-testing

  # Serial-test crates — integration tests that spin up real `NmpApp` instances
  # via `nmp_app_new`. Each test binary has a `static SERIAL: Mutex<()>` guard,
  # but nextest runs each test binary in its own process so the mutex does not
  # cross binary boundaries. Running these crates with `--test-threads=1`
  # serializes test execution within the nextest invocation, preventing the
  # global-actor-thread races that caused op_feed_* failures under parallel
  # nextest on Linux CI.
  serial-crates:
    name: cargo nextest (serial NmpApp crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: serial-crates

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest (serial NmpApp crates)
        run: |
          cargo nextest run --no-fail-fast --test-threads=1 \
            -p nmp-defaults \
            -p nmp-nip29 \
            -p nmp-testing

  lmdb:
    name: cargo nextest (lmdb-backend acceptance gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: lmdb-backend

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Epic #1523 cache adoption acceptance gates.
      #
      # cache_no_materialization_gate: proves that early ControlFlow::Break in
      #   query_visit stops LMDB event conversion immediately — no over-scan.
      # cache_serve_replay_fixtures: Mem ≡ LMDB parity fixtures (5 query
      #   shapes, both backends via for_each_backend!).
      #
      # nmp-core --features lmdb-backend: exercises the LMDB storage path
      #   that the default-features workspace lane does not compile.
      - name: cargo nextest (lmdb-backend)
        run: |
          cargo nextest run -p nmp-core --features lmdb-backend --no-fail-fast
          cargo nextest run -p nmp-testing --features lmdb-backend --test cache_no_materialization_gate --no-fail-fast
          cargo nextest run -p nmp-testing --features lmdb-backend --test cache_serve_replay_fixtures --no-fail-fast
        env:
          RUSTFLAGS: ""

  ffi-features:
    name: cargo nextest (feature-gated surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ffi-features

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # ADR-0048 Stage 2 NIP-55 proof gate (advances #1124).
      #
      # `cargo nextest --workspace` (workspace job) runs nmp-ffi with default
      # features, which excludes the `external-signer` feature. The
      # signin_loop_* tests in `crates/nmp-ffi/src/external_signer.rs` are
      # therefore skipped by the default lane. This step adds the explicit
      # `--features external-signer` pass to prove those tests are run and
      # green.
      - name: cargo nextest (nmp-ffi --features external-signer)
        run: cargo nextest run -p nmp-ffi --features external-signer --no-fail-fast

      # ADR-0048 Stage 2 — nmp-app-gallery android-ffi feature check.
      #
      # `nmp-app-gallery` is a workspace member, so the workspace job compiles
      # it with default features. The `android-ffi` feature enables the JNI
      # shim surface (`Java_org_nmp_gallery_*` symbols, `jni` dep) that no
      # other workspace build exercises. This `cargo check` catches compile
      # breaks in the JNI glue without requiring a cross-compiled .so or an
      # emulator. Host-target check only.
      - name: cargo check (nmp-app-gallery --features android-ffi)
        run: cargo check -p nmp-app-gallery --features android-ffi

  app-crates:
    name: cargo test (nmp-app-chirp, no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: app-crates

      # Issues #1553/#1941 — execute the deterministic app-crate behavior tests
      # that the workspace lane intentionally excludes: feed/session behavior,
      # DM signer-port round trips, typed action/projection registration, and
      # FFI smoke paths. `--test-threads=1` keeps the public `NmpApp` FFI tests
      # serialized because several test targets spin up actor threads in the
      # same process. `--no-default-features` keeps wallet/LMDB default-feature
      # coverage and feature-gated Marmot out of this PR lane; live-relay
      # coverage remains in `real-relay-nightly.yml`.
      - name: cargo test (nmp-app-chirp no-default-features, executed)
        run: cargo test -p nmp-app-chirp --no-default-features -- --test-threads=1

  android-ffi:
    # ADR-0048 Stage 2 — nmp-chirp-android-ffi host test gate (advances #1124).
    #
    # The crate has its own `[workspace]` table, so `cargo build/test
    # --workspace` from the repo root never touches it — a Rust-level break
    # there is otherwise invisible to CI until an Android build runs.
    #
    # This job runs THREE gates of increasing fidelity:
    #   1. `cargo test` — host unit + integration tests (JNI symbol parity,
    #      Rust re-export coverage, and the #1218 openssl-src pin guard).
    #      Hermetic string-search over `include_str!` source/manifest files;
    #      links the test binary against the host target, no NDK or emulator.
    #   2. `cargo check --features marmot` — fast host-target scope check for
    #      the Marmot feature graph (catches Rust import/trait errors).
    #   3. `cargo ndk ... x86_64-linux-android` — a REAL single-ABI
    #      cross-compile that exercises the vendored-OpenSSL build the APK
    #      depends on. This is the gate that would have caught #1218 (host
    #      check #2 is blind to it).
    name: cargo test (android-ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/chirp/nmp-chirp-android-ffi
          key: android-ffi

      - name: cargo test (nmp-chirp-android-ffi standalone workspace)
        run: cd apps/chirp/nmp-chirp-android-ffi && cargo test

      # Marmot-feature host compile gate.
      #
      # The cargoNdk task in android/app/build.gradle.kts passes `--features
      # marmot` when building the APK, but CI previously only ran `cargo test`
      # (no features), so a Rust-level compile break under `--features marmot`
      # was invisible until a developer ran a full Android build locally.
      #
      # This step catches scope/trait/import errors (e.g. missing
      # `jstring_to_cstring` import, missing `zeroize std` feature, missing
      # `libsqlite3-sys` vendored OpenSSL dep) on the host target. It is fast
      # because it never cross-compiles, but for that same reason it is BLIND
      # to NDK-only failures — most notably #1218, where the vendored OpenSSL
      # `providers/ml_kem` source failed to cross-compile for
      # `x86_64-linux-android` under NDK 26 while the host build stayed green.
      - name: cargo check (nmp-chirp-android-ffi --features marmot)
        run: cd apps/chirp/nmp-chirp-android-ffi && cargo check --features marmot

      # Real NDK cross-compile gate — closes the #1218 blind spot.
      #
      # The host `cargo check` above cannot see vendored-OpenSSL cross-compile
      # breakage because no Android target is built. This step runs the SAME
      # `cargo ndk` invocation the APK uses (android/app/build.gradle.kts),
      # but scoped to a SINGLE ABI: `x86_64-linux-android`. x86_64 is the
      # cheapest ABI to build in CI (native host arch — no QEMU) AND is
      # precisely the ABI that #1218 broke, so it is the
      # highest-signal/lowest-cost gate. A green here proves the vendored
      # OpenSSL (pinned to a pre-ml_kem 3.4.x line) actually cross-compiles,
      # not merely that the Rust scopes resolve.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Add x86_64-linux-android Rust target
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # `nttld/setup-ndk` exports ANDROID_NDK_HOME into the job env, which
      # `cargo ndk` reads to locate the clang cross-toolchain — no explicit
      # passthrough needed.
      - name: cargo ndk cross-compile (x86_64, --features marmot)
        run: |
          cd apps/chirp/nmp-chirp-android-ffi
          cargo ndk -t x86_64 -o ./jniLibs-ci build --release --features marmot
