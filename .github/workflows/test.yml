name: test

# Runs `cargo test` on every PR and every push to master. This is the first
# build/test gate in CI — the other workflows (doctrine-lint, file-size-gate,
# supply-chain) lint and audit but never compile or run the test suite.
#
# Excluded crates (do not build on a bare `ubuntu-latest` runner):
#   - nmp-android-ffi : standalone `[workspace]` table, not a parent member.
#   - nmp-app-chirp   : hard-depends on `apple-native-keyring-store` (Apple-only).
#   - nmp-gallery-desktop : uses iced, which pulls `winit` needing
#                       libxkbcommon/wayland/xcb apt packages absent on the
#                       bare runner. It is a thin GUI shell with no tests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The full workspace build + all test binaries (secp256k1, lmdb, openmls,
      # flatbuffers, …) exhaust the ~14 GB free on a bare `ubuntu-latest`
      # runner during linking ("No space left on device" / ld Bus error). Drop
      # the preinstalled SDKs we never use to reclaim ~25 GB before building.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test (default features)
        run: cargo test --workspace --exclude nmp-android-ffi --exclude nmp-app-chirp --exclude nmp-gallery-desktop

      - name: cargo test (lmdb-backend)
        run: cargo test -p nmp-core --features lmdb-backend
        env:
          RUSTFLAGS: ""

      # ADR-0048 Stage 2 NIP-55 proof gate (advances #1124).
      #
      # `cargo test --workspace` (above) runs nmp-ffi with default features,
      # which excludes the `external-signer` feature. The signin_loop_* tests
      # in `crates/nmp-ffi/src/external_signer.rs` are therefore skipped by
      # the default lane. This step adds the explicit `--features
      # external-signer` pass to prove those tests are run and green.
      #
      # The feature is cheap: it activates `nmp-signer-iface` + `nmp-signers`
      # (already compiled for the default test run), so this step costs only
      # the incremental delta for the feature-gated code paths.
      - name: cargo test (nmp-ffi --features external-signer)
        run: cargo test -p nmp-ffi --features external-signer

      # ADR-0048 Stage 2 — nmp-app-gallery android-ffi feature check.
      #
      # `nmp-app-gallery` is a workspace member, so `cargo test --workspace`
      # compiles it with default features. The `android-ffi` feature enables
      # the JNI shim surface (`Java_org_nmp_gallery_*` symbols, `jni` dep)
      # that no other workspace build exercises. This `cargo check` catches
      # compile breaks in the JNI glue without requiring a cross-compiled .so
      # or an emulator.
      #
      # Host-target check only (same posture as `nmp-android-ffi` below).
      - name: cargo check (nmp-app-gallery --features android-ffi)
        run: cargo check -p nmp-app-gallery --features android-ffi

  android-ffi:
    # ADR-0048 Stage 2 — nmp-android-ffi host test gate (advances #1124).
    #
    # The crate has its own `[workspace]` table, so `cargo build/test
    # --workspace` from the repo root never touches it — a Rust-level break
    # there is otherwise invisible to CI until an Android build runs.
    #
    # This job runs the full `cargo test` (not just `cargo check`):
    #   - 5 unit tests in `src/` (external_signer + session)
    #   - 2 integration tests in `tests/bridge_parity.rs` (JNI symbol parity +
    #     Rust re-export coverage)
    # Total: 7 tests, verified green locally.
    #
    # The crate is a `cdylib`, but `cargo test` still links the test binary
    # against the host target — it does NOT require a cross-compiled .so or an
    # Android emulator. The integration test is hermetic string-search over
    # `include_str!` source files.
    name: cargo test (android-ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/nmp-android-ffi/target
          key: ${{ runner.os }}-cargo-android-ffi-${{ hashFiles('crates/nmp-android-ffi/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-ffi-

      - name: cargo test (nmp-android-ffi standalone workspace)
        run: cd crates/nmp-android-ffi && cargo test

      # Marmot-feature host compile gate.
      #
      # The cargoNdk task in android/app/build.gradle.kts passes `--features
      # marmot` when building the APK, but CI previously only ran `cargo test`
      # (no features), so a Rust-level compile break under `--features marmot`
      # was invisible until a developer ran a full Android build locally.
      #
      # This step catches scope/trait/import errors (e.g. missing
      # `jstring_to_cstring` import, missing `zeroize std` feature, missing
      # `libsqlite3-sys` vendored OpenSSL dep) on the host target without
      # requiring NDK cross-compilation in CI. A host `cargo check --features
      # marmot` is sufficient because the breakages are Rust scope errors, not
      # link-time or ABI errors.
      - name: cargo check (nmp-android-ffi --features marmot)
        run: cd crates/nmp-android-ffi && cargo check --features marmot
