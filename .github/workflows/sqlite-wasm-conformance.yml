name: sqlite-wasm-conformance

# Dedicated-Worker OPFS-SQLite conformance gate for crates/nmp-sqlite-wasm
# (issue #1007, PR-6).
#
# nmp-sqlite-wasm's dependency graph is pure JS/Rust interop (js-sys,
# wasm-bindgen, web-sys, wasm-bindgen-futures). It has NO C dependency, so this
# job builds with the stock wasm32 toolchain and actually executes the engine in
# a headless browser. It remains the end-to-end proof of the Worker-only OPFS
# SyncAccessHandle path, while browser-runtime.yml provides the blocking wasm32
# compile gate for the full runtime graph that pulls in secp256k1-sys.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sqlite-wasm-conformance.yml"
      - "crates/nmp-sqlite-wasm/**"
      - "crates/nmp-sqlite-wasm-conformance/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/sqlite-wasm-conformance.yml"
      - "crates/nmp-sqlite-wasm/**"
      - "crates/nmp-sqlite-wasm-conformance/**"

permissions:
  contents: read

jobs:
  opfs-worker-conformance:
    name: OPFS dedicated-Worker conformance (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: sqlite-wasm-conformance

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # wasm-bindgen-cli MUST match the wasm-bindgen runtime version baked into
      # the compiled wasm (a mismatch fails with a schema-version error). Derive
      # the exact version from Cargo.lock so a future lock bump cannot silently
      # break this gate.
      - name: Install wasm-bindgen-cli (version pinned to Cargo.lock)
        run: |
          WBG_VER="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
            | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "wasm-bindgen runtime version from Cargo.lock: $WBG_VER"
          cargo install wasm-bindgen-cli --version "$WBG_VER" --locked \
            || cargo install wasm-bindgen-cli --version "$WBG_VER"

      - name: Install harness dependencies (Playwright)
        run: npm install --no-audit --no-fund
        working-directory: crates/nmp-sqlite-wasm-conformance/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: crates/nmp-sqlite-wasm-conformance/web

      # build.sh: cargo build (wasm32) → wasm-bindgen --target web → stage the
      # vendored sqlite engine next to the copied shim snippet → copy the Worker
      # entry + host page into pkg/.
      - name: Build conformance harness bundle
        run: bash ./build.sh
        working-directory: crates/nmp-sqlite-wasm-conformance/web

      # Drives headless Chromium: serves pkg/ on http://127.0.0.1 (secure context
      # for OPFS), spawns the dedicated Worker, runs the engine, asserts every
      # step. Exits non-zero on any failure — never a faked pass.
      - name: Run dedicated-Worker OPFS conformance
        run: node ./run-conformance.mjs
        working-directory: crates/nmp-sqlite-wasm-conformance/web
