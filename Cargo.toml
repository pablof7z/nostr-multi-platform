# PARKED CRATES — excluded from the default workspace build.
#
# These crates are post-v1 (tracked in GitHub Issues) and their primary
# action stubs return `Err(Unsupported)`. Keeping them as active members
# would violate the no-dead-code / no-false-advertising rule in AGENTS.md
# §155-170. The code is preserved in-tree so it is ready when the
# corresponding milestone enters scope:
#
#   nmp-nip59-decrypt-only — NIP-59 decrypt-only staticlib; intended consumer
#                            is an external iOS notification-service extension
#                            that links it as a staticlib. Parked pending
#                            issue #2289.
#
# NOTE: nmp-blossom was previously parked here but is in fact a v1 crate —
# it is complete (no Unsupported stubs) and shipped by external consumers
# (hl, podcast-player). Un-parked into [workspace].members so CI builds and
# tests it; consumers no longer need a local [patch] workaround.
#
# NOTE: nmp-nip60 was previously parked here (issue #1250) pending the NIP-60
# wallet milestone (#1001). It re-entered [workspace].members in #2865 (Phase
# 0 of the wallet epic #2864, per
# docs/architecture/nip60-nip61-wallet-design.md) once its false pay_invoice
# surface was removed and CI coverage was restored.
#
# To build a parked crate on demand:
#   cargo build --manifest-path crates/nmp-nip59-decrypt-only/Cargo.toml
exclude = [
    "crates/nmp-nip59-decrypt-only",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pablof7z/nostr-multi-platform"
version = "1.0.0-rc.1"

# Shared third-party dependency versions. Declare the *version* and the
# default-features posture here only; each member crate adds its own
# `features = [...]` at the use site via `dep.workspace = true`, since the
# feature sets diverge per crate (e.g. nostr: nip04/nip44/nip49/std vary).
# Single source of truth for versions prevents duplicate-version builds when
# one crate's manifest drifts.
#
# CRITICAL — `default-features`: a bare `dep = "x.y"` entry implies
# `default-features = true`, and Cargo *silently ignores* a member-side
# `default-features = false` when the workspace entry has defaults on. So
# `rustls`/`tungstenite` are declared with `default-features = false` here:
# every member uses `features = ["ring"]` (NOT the `aws-lc-rs` default crypto
# provider). A bare entry pulls aws-lc-rs + a C toolchain into the build.
#
# TODO: `nostr` is left as a bare entry because its feature posture is split
#   across the workspace — most crates want defaults ON, `nmp-marmot` /
#   `nmp-nostr-lmdb` want `default-features = false, features = ["std"]`.
#   Switching the workspace entry to `default-features = false` would require
#   adding explicit feature lists to the defaults-on crates in the same pass;
#   deferred to keep this commit scoped. Feature unification keeps `std` on
#   regardless, so this is a clarity gap, not a build-correctness one.
#
# Mechanical workspace-owned dependency migration is complete for serde,
# serde_json, zeroize, rustls, tungstenite, and nmp-ownership; the
# doctrine_lint_smoke manifest ratchet rejects member manifests that
# reintroduce explicit version/path declarations for those deps. `nostr`
# remains the policy boundary above.
[workspace.dependencies]
flatbuffers = "25.12.19"
nostr = "0.44"
serde = "1.0"
serde_json = "1.0"
nmp-ownership = { path = "crates/nmp-ownership", version = "1.0.0-rc.1" }
rustls = { version = "0.23", default-features = false }
tungstenite = { version = "0.24", default-features = false }
# Secret-material zeroization. `derive` enables `#[derive(ZeroizeOnDrop)]`.
zeroize = { version = "1", features = ["derive"] }

# Smaller debug info for faster compile + smaller target/ cache. Line tables
# preserve backtraces; full debug info bloats compile and the CI cache by
# ~30%. This is the standard tradeoff for dev/test builds.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
