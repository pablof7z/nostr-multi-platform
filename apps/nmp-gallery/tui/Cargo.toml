[package]
name = "nmp-gallery-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ratatui target for NmpGallery component previews."

[lib]
name = "nmp_gallery_tui"
path = "src/lib.rs"

[[bin]]
name = "nmp-gallery-tui"
path = "src/main.rs"

[dependencies]
nmp-ownership = { workspace = true }
crossterm = "0.29"
nmp-app-gallery = { path = "../crates/nmp-app-gallery" }
nmp-content = { path = "../../../crates/nmp-content" }
nmp-core = { path = "../../../crates/nmp-core" }
nmp-nostr-id = { path = "../../../crates/nmp-nostr-id" }
nmp-native-runtime = { path = "../../../crates/nmp-native-runtime" }
ratatui = { version = "0.30", features = ["crossterm"] }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm"] }
serde_json = { workspace = true }

[dev-dependencies]
nmp-nip23 = { path = "../../../crates/nmp-nip23" }
