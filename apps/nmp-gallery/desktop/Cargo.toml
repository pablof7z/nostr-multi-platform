[package]
name = "nmp-gallery-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iced component gallery for NMP desktop widgets. Sidebar lists canonical registry.json components; user-* components show live kind:0 data via the same kernel flows as the TUI gallery."

[[bin]]
name = "nmp-gallery-desktop"
path = "src/main.rs"

[dependencies]
nmp-ownership = { workspace = true }
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "advanced"] }
nmp-app-gallery = { path = "../crates/nmp-app-gallery" }
nmp-content = { path = "../../../crates/nmp-content" }
nmp-core = { path = "../../../crates/nmp-core" }
nmp-gallery-tui = { path = "../tui" }
tokio = { version = "1", features = ["sync"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
