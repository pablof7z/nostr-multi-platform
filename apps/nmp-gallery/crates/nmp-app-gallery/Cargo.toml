[package]
name = "nmp-app-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NmpGallery app-owned UniFFI facade over nmp-native-runtime. Produces libnmp_app_gallery for iOS and Android."

[lib]
# `staticlib` so the iOS shell can link `-lnmp_app_gallery` alongside the
# other NMP archives; `cdylib` so `uniffi-bindgen generate --library` and the
# Android NDK build produce `libnmp_app_gallery.so`/`.dylib` directly; `rlib`
# so Rust-side consumers (integration tests, TUI/desktop hosts) reach the
# composition installer and gallery helpers through normal Rust paths.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native"]
# The gallery facade is native-only (wasm uses wasm-bindgen, not UniFFI), so
# the entire crate is gated behind `native`. Enabled by default.
native = [
    "nmp-native-runtime/external-signer",
]

[dependencies]
nmp-ownership = { workspace = true }
# Native runtime owner — `NmpApp` handle + lifecycle API, owned by value
# inside the facade's `Arc<GalleryApp>` UniFFI object.
nmp-native-runtime = { path = "../../../../crates/nmp-native-runtime" }
# Shared Rust-side mechanics (lifecycle, update sink, capability callback,
# dispatch, clamp policy) the facade delegates to — never copied.
nmp-uniffi-support = { path = "../../../../crates/nmp-uniffi-support" }
nmp-core = { path = "../../../../crates/nmp-core" }
nmp-nostr-id = { path = "../../../../crates/nmp-nostr-id" }
nmp-content = { path = "../../../../crates/nmp-content" }
nmp-nip02 = { path = "../../../../crates/nmp-nip02" }
nmp-nip17 = { path = "../../../../crates/nmp-nip17" }
nmp-nip18 = { path = "../../../../crates/nmp-nip18" }
nmp-nip23 = { path = "../../../../crates/nmp-nip23" }
nmp-nip22 = { path = "../../../../crates/nmp-nip22" }
nmp-nip25 = { path = "../../../../crates/nmp-nip25" }
nmp-nip29 = { path = "../../../../crates/nmp-nip29" }
nmp-nip50 = { path = "../../../../crates/nmp-nip50" }
nmp-nip51 = { path = "../../../../crates/nmp-nip51" }
nmp-nip84 = { path = "../../../../crates/nmp-nip84" }
nmp-replies = { path = "../../../../crates/nmp-replies" }
nmp-router = { path = "../../../../crates/nmp-router" }
nmp-signer-iface = { path = "../../../../crates/nmp-signer-iface" }
nmp-substrate = { path = "../../../../crates/nmp-substrate" }
nmp-wot = { path = "../../../../crates/nmp-wot" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
uniffi = { version = "0.29" }

[dev-dependencies]
# Test-support gates expose `signin_nsec_for_test` / `inject_signed_event_json_for_test`
# so the in-crate smoke tests can spin up a real `NmpApp`, call the gallery
# composition installer, and confirm registration didn't panic / didn't fail
# closed.
nmp-native-runtime = { path = "../../../../crates/nmp-native-runtime", features = ["test-support"] }
