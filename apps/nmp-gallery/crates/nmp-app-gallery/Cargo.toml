[package]
name = "nmp-app-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NmpGallery explicit composition root over nmp-native-runtime. Produces libnmp_app_gallery for iOS and Android."

[lib]
# `staticlib` so the iOS shell can link `-lnmp_app_gallery` alongside the
# other NMP archives, `cdylib` so the
# Android NDK build produces `libnmp_app_gallery.so` directly (rather than
# going through a parallel JNI shim crate like `nmp-android-ffi`), and
# `rlib` so Rust-side consumers (integration tests, future Android JNI
# shims) reach the symbols through normal Rust paths.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native"]
# The gallery composition root is native-only (wasm uses wasm-bindgen, not
# C-ABI), so the entire crate is gated behind `native`. Enabled by default.
native = ["nmp-uniffi/native"]
# `android-ffi` enables the JNI shim surface consumed by
# `org.nmp.gallery.bridge.KernelBridge`. Implies `native` (the shim is a
# native consumer). Activates the `jni` dependency so the symbols are
# only pulled in when building the Android .so.
android-ffi = ["dep:jni", "nmp-uniffi/native"]

[dependencies]
nmp-ownership = { workspace = true }
# Native runtime owner — `NmpApp` handle + lifecycle API.
nmp-native-runtime = { path = "../../../../crates/nmp-native-runtime" }
# M14 UniFFI shell migration: the gallery iOS shell migrates from the nmp-ffi
# C-ABI to the UniFFI Swift surface. Including nmp-uniffi here ensures every
# `uniffi_nmp_uniffi_*` symbol lives in `libnmp_app_gallery.a` so the iOS
# linker sees a single archive. The `nmp_app_gallery_register_uniffi` bridge
# function (below) also relies on `nmp_uniffi::NmpApp::inner` for the Arc→
# native pointer extraction.
nmp-uniffi = { path = "../../../../crates/nmp-uniffi", default-features = false }
nmp-core = { path = "../../../../crates/nmp-core" }
nmp-nostr-id = { path = "../../../../crates/nmp-nostr-id" }
nmp-content = { path = "../../../../crates/nmp-content" }
nmp-nip02 = { path = "../../../../crates/nmp-nip02" }
nmp-nip17 = { path = "../../../../crates/nmp-nip17" }
nmp-nip18 = { path = "../../../../crates/nmp-nip18" }
nmp-nip22 = { path = "../../../../crates/nmp-nip22" }
nmp-nip25 = { path = "../../../../crates/nmp-nip25" }
nmp-nip29 = { path = "../../../../crates/nmp-nip29" }
nmp-nip50 = { path = "../../../../crates/nmp-nip50" }
nmp-nip51 = { path = "../../../../crates/nmp-nip51" }
nmp-nip84 = { path = "../../../../crates/nmp-nip84" }
nmp-replies = { path = "../../../../crates/nmp-replies" }
nmp-router = { path = "../../../../crates/nmp-router" }
nmp-signer-iface = { path = "../../../../crates/nmp-signer-iface" }
nmp-substrate = { path = "../../../../crates/nmp-substrate" }
nmp-wot = { path = "../../../../crates/nmp-wot" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
# JNI surface for the Android shell — only active under `android-ffi`.
jni = { version = "0.21", optional = true }

[dev-dependencies]
# Test-support gates expose `signin_nsec_for_test` / `inject_signed_event_json_for_test`
# so the in-crate smoke tests can spin up a real `NmpApp`, call
# `nmp_app_gallery_register`, and confirm the registration didn't panic
# / didn't fail closed.
nmp-native-runtime = { path = "../../../../crates/nmp-native-runtime", features = ["test-support"] }
