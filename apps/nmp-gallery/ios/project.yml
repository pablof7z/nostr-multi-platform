name: NmpGallery
options:
  bundleIdPrefix: org.nmp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 456SHKPP26
targets:
  NmpGallery:
    type: application
    platform: iOS
    sources:
      - path: NmpGallery
      # M14 UniFFI shell migration: the generated Swift binding for nmp-uniffi.
      # Included directly from the crate's generated/ directory so the file
      # stays authoritative in one place (regenerated by
      # ci/check-uniffi-bindings-drift.sh). The modulemap is found via
      # SWIFT_INCLUDE_PATHS below.
      - path: ../../../crates/nmp-uniffi/generated/swift/nmp_uniffi.swift
    info:
      path: NmpGallery/App/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CFBundleDisplayName: NmpGallery
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nmp.gallery
        PRODUCT_MODULE_NAME: NmpGallery
        PRODUCT_NAME: NmpGallery
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: NmpGallery/Bridge/NmpGallery.h
        # M14 UniFFI shell migration: the `nmp_uniffi.swift` binding uses
        # `#if canImport(nmp_uniffiFFI)` / `import nmp_uniffiFFI`. The
        # `nmp_uniffiFFI` clang module is declared by the generated modulemap.
        # SWIFT_INCLUDE_PATHS makes the directory visible for module lookup.
        # OTHER_SWIFT_FLAGS adds an explicit -fmodule-map-file for Xcode's
        # explicit-module-build mode (which ignores implicit modulemaps).
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../../../crates/nmp-uniffi/generated/swift"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/../../../crates/nmp-uniffi/generated/swift/nmp_uniffiFFI.modulemap"
        # The gallery links one aggregate Rust archive — `libnmp_app_gallery.a` —
        # that bundles the kernel + the gallery-tailored projection + ALL
        # nmp-uniffi UniFFI symbols (nmp-uniffi is a dep of nmp-app-gallery).
        # The sibling `apps/nmp-gallery/crates/nmp-app-gallery` crate builds it via
        # `cargo build -p nmp-app-gallery --target aarch64-apple-ios-sim`.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(SRCROOT)/../../../target/aarch64-apple-ios/debug
          - $(SRCROOT)/../../../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(SRCROOT)/../../../target/aarch64-apple-ios-sim/debug
          - $(SRCROOT)/../../../target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: "$(inherited) -lnmp_app_gallery"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  NmpGallery:
    build:
      targets:
        NmpGallery: all
