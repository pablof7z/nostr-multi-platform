# PARKED — depends on nmp-nip60 (Cashu / nutzaps, issue #1001), which is post-v1.
# Not a member of the default workspace build (see top-level Cargo.toml exclude).
# Compile on demand: `cargo build --manifest-path apps/nmp-wallet-poc/Cargo.toml`.
# Re-activate when #1001 enters scope (together with nmp-nip60).
[package]
name = "nmp-wallet-poc"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository.workspace = true
description = "NIP-60 wallet proof-of-concept: deposit testnut tokens, send a nutzap, receive and redeem. PARKED: post-v1 (depends on nmp-nip60 / #1001)."

[[bin]]
name = "wallet-poc"
path = "src/main.rs"

[dependencies]
nmp-nip60 = { path = "../../crates/nmp-nip60" }
nostr = { version = "0.44", features = ["std", "nip44", "nip60"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
